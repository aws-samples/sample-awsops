AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AWSops cross-account read-only role. Deploy this in each TARGET account you want AWSops to read
  (cost, Bedrock metrics, inventory, etc.). The host AWSops web task role assumes this role via
  STS; optionally, the host worker task role can be trusted too (WorkerTaskRoleArn, ADR-011
  amended 2026-08-25) for the Network Path Check / SG Rules & Usage workers' own reads.
  ExternalId is OPTIONAL (ADR-011 amended 2026-06-26): omit it for 1st-party accounts — trust is
  pinned to the exact host task-role ARN(s) that are set; supply it for 3rd-party/shared accounts.
  Read-only only (ReadOnlyAccess) — AWSops never mutates target-account resources.

Parameters:
  HostTaskRoleArn:
    Type: String
    Description: ARN of the AWSops host WEB task role (registration/verify + read), e.g. arn:aws:iam::<host>:role/awsops-v2-task
    AllowedPattern: '^arn:aws:iam::\d{12}:role/.+$'
  WorkerTaskRoleArn:
    Type: String
    Default: ''
    # CI-review finding (network-path-check round 19, "explicitly UNVERIFIED" item): the worker
    # Fargate task role (awsops-v2-worker-task) is a DIFFERENT IAM principal than the web task
    # role above, but it also assumes this SAME AWSopsReadOnlyRole — for the sg-rules worker's
    # own EC2/ENI-inventory-snapshot reads (sg_rule_scan.py; this is NOT the isolated Athena
    # broker's own role — ADR-019's Role A/B separation keeps Athena access strictly on
    # `AWSopsSgRuleAthenaRole`, untouched by this parameter) and the Network Path Check worker
    # (network_path.py's resolve_live_identity()/fetch_live_topology()) doing member-account
    # reads. Before this parameter existed, only the web task role was ever trusted, so a
    # member-account read from either worker's own task role would AccessDenied — a pre-existing
    # gap shared by BOTH sibling workers, not introduced by either one. OPTIONAL and additive:
    # leave empty (the default) to keep the exact pre-existing single-principal trust unchanged;
    # set it once this account also needs to be reachable from the worker task role.
    AllowedPattern: '^$|^arn:aws:iam::\d{12}:role/.+$'
    Description: >
      OPTIONAL. ARN of the AWSops host WORKER Fargate task role (awsops-v2-worker-task), e.g.
      arn:aws:iam::<host>:role/awsops-v2-worker-task — needed only if this target account is used
      as a source/destination for a worker-driven member-account read (the sg-rules worker's own
      EC2/ENI-inventory reads, or a Network Path Check resolve_live_identity() call). Leave empty
      otherwise.
  ExternalId:
    Type: String
    Default: ''
    # empty (1st-party, ARN-pinned trust) OR ≥8 chars (3rd-party) — never a weak 1-7 char value.
    AllowedPattern: '^$|^.{8,}$'
    Description: >
      OPTIONAL shared ExternalId (confused-deputy guard). Leave EMPTY for 1st-party accounts — trust
      is already pinned to the host web task-role ARN above. REQUIRED (≥8 chars) for 3rd-party/shared
      accounts: set the same value you register in AWSops /accounts.
    NoEcho: true
  RoleName:
    Type: String
    Default: AWSopsReadOnlyRole
    Description: Role name AWSops expects (keep the default unless you override role_name in /accounts).

Conditions:
  HasExternalId: !Not [!Equals [!Ref ExternalId, '']]
  HasWorkerTaskRoleArn: !Not [!Equals [!Ref WorkerTaskRoleArn, '']]

Resources:
  AWSopsReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: AWSops cross-account read-only access (assumed by the host web/worker task roles).
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              # ONLY the host web task role (and, when supplied, the host worker task role),
              # ARN-validated — NOT account root, NOT a wildcard (least privilege). Additive: the
              # worker principal is included only when WorkerTaskRoleArn is non-empty, so an
              # existing stack that never sets it keeps the EXACT pre-existing single-principal
              # trust unchanged on update.
              # (The steampipe task role is added by the multi-account inventory fan-out PR, which
              # also grants it the source-side sts:AssumeRole — kept together there for consistency.)
              AWS: !If
                - HasWorkerTaskRoleArn
                - [!Ref HostTaskRoleArn, !Ref WorkerTaskRoleArn]
                - !Ref HostTaskRoleArn
            Action: 'sts:AssumeRole'
            # 1st-party (no ExternalId): the exact-ARN principal pin IS the confused-deputy guard.
            # 3rd-party: add the ExternalId StringEquals condition.
            Condition: !If
              - HasExternalId
              - StringEquals:
                  'sts:ExternalId': !Ref ExternalId
              - !Ref 'AWS::NoValue'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess

Outputs:
  RoleArn:
    Description: Register this account in AWSops /accounts (the role name must match).
    Value: !GetAtt AWSopsReadOnlyRole.Arn
