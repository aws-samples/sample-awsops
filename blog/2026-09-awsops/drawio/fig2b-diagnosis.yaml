# Topology reference only. Edit the .drawio source; build.py validates and exports it.
canonical_source: fig2b-diagnosis.drawio
title: 인벤토리와 예약 진단
grouping: functional flow; no network boundaries
components:
- id: steampipe
  label: Steampipe / AWS Fargate
- id: sync
  label: 동기화 Lambda / 15분 주기
- id: aurora
