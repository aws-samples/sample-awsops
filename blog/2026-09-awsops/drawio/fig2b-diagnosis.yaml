- id: graph
  label: Resource Graph
- id: schedule
  label: Amazon EventBridge / 매시간 예약 확인
- id: sqs
  label: Amazon SQS
- id: sfn
  label: AWS Step / Functions
- id: worker
  label: AWS Fargate 워커 / 호스트 API 조회·분석
- id: report_bedrock
  label: Amazon Bedrock
- id: artifacts
  label: Amazon S3 / 진단 리포트
- id: digest
  label: 완료 리포트 집계 / Lambda · 15분 주기
- id: sns
  label: Amazon SNS / 선택적 이메일
flows:
- id: inventory_0
