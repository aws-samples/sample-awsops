  from: sfn
  to: worker
  label: 진단 실행
- id: report_3
  from: worker
  to: aurora
  label: 인벤토리 조회
- id: report_4
  from: worker
  to: report_bedrock
  label: 직접 추론
- id: report_5
  from: worker
  to: artifacts
  label: 저장
- id: notify
  from: digest
  to: sns
  label: 수신 확인된 구독자에게 알림
