  <title id="dataflow-ko-title">AWSops v2 비공개 엣지 데이터 흐름</title>
  <desc id="dataflow-ko-desc">뷰어 요청이 비공개 엣지를 거쳐 Fargate web BFF에 도달하고, BFF는 Aurora, Aurora에 결과를 다시 쓰는 비동기 워커 파이프라인, 그리고 라이브 AWS API 위에서 동작하는 AgentCore AI 챗 경로로 분기한다.</desc>
