    \  <tmp_path>/data/tmp/</tmp_path>\n  <user_files_path>/data/user_files/</user_files_path>\n\
    \  <format_schema_path>/data/format_schemas/</format_schema_path>\n  <max_server_memory_usage>2684354560</max_server_memory_usage>\n\
    \  <logger><level>warning</level><console>true</console></logger>\n</clickhouse>\n"
kind: ConfigMap
metadata:
  annotations: {}
  name: clickhouse
  namespace: central-observability
---
apiVersion: v1
data:
  config.yaml: "extensions:\n  healthcheckv2:\n    use_v2: true\n    http:\n     \
    \ endpoint: 0.0.0.0:13133\n  jaeger_query:\n    storage:\n      traces: persistent\n\
    \    http:\n      endpoint: 0.0.0.0:16686\n  jaeger_storage:\n    backends:\n\
    \      persistent:\n        badger:\n          directories:\n            keys:\
    \ /data/keys\n            values: /data/values\n          ephemeral: false\n \
    \         ttl:\n            spans: 168h\nreceivers:\n  otlp:\n    protocols:\n\
    \      grpc:\n        endpoint: 0.0.0.0:4317\nprocessors:\n  batch: {}\nexporters:\n\
    \  jaeger_storage_exporter:\n    trace_storage: persistent\nservice:\n  extensions:\n\
    \  - healthcheckv2\n  - jaeger_storage\n  - jaeger_query\n  pipelines:\n    traces:\n\
    \      receivers:\n      - otlp\n      processors:\n      - batch\n      exporters:\n\
    \      - jaeger_storage_exporter\n"
kind: ConfigMap
metadata:
  annotations: {}
  name: jaeger
  namespace: central-observability
---
apiVersion: v1
data:
  config.yaml: "auth_enabled: false\nserver:\n  http_listen_port: 3100\ncommon:\n\
    \  path_prefix: /data\n  replication_factor: 1\n  ring:\n    kvstore:\n      store:\
    \ inmemory\n  storage:\n    filesystem:\n      chunks_directory: /data/chunks\n\
    \      rules_directory: /data/rules\nschema_config:\n  configs:\n  - from: '2026-01-01'\n\
    \    store: tsdb\n    object_store: filesystem\n    schema: v13\n    index:\n\
    \      prefix: index_\n      period: 24h\ncompactor:\n  working_directory: /data/compactor\n\
    \  retention_enabled: true\n  delete_request_store: filesystem\nlimits_config:\n\
    \  retention_period: 168h\n  allow_structured_metadata: true\n  ingestion_rate_mb:\
    \ 16\n  ingestion_burst_size_mb: 32\nanalytics:\n  reporting_enabled: false\n"
kind: ConfigMap
metadata:
  annotations: {}
  name: loki
  namespace: central-observability
---
apiVersion: v1
data:
  config.yaml: "target: all\nmultitenancy_enabled: false\nserver:\n  http_listen_port:\
    \ 9009\n  grpc_listen_port: 9095\ningest_storage:\n  enabled: false\ncommon:\n\
    \  storage:\n    backend: filesystem\n    filesystem:\n      dir: /data/storage\n\
    blocks_storage:\n  backend: filesystem\n  filesystem:\n    dir: /data/blocks\n\
    \  tsdb:\n    dir: /data/tsdb\n  bucket_store:\n    sync_dir: /data/tsdb-sync\n\
    ingester:\n  ring:\n    replication_factor: 1\n    kvstore:\n      store: inmemory\n\
    compactor:\n  data_dir: /data/compactor\n  sharding_ring:\n    kvstore:\n    \
    \  store: inmemory\nstore_gateway:\n  sharding_ring:\n    replication_factor:\
    \ 1\n    kvstore:\n      store: inmemory\nruler:\n  rule_path: /data/rules\n \
    \ ring:\n    kvstore:\n      store: inmemory\nruler_storage:\n  backend: filesystem\n\
    \  filesystem:\n    dir: /data/ruler-storage\nlimits:\n  compactor_blocks_retention_period:\
    \ 168h\n  max_global_series_per_user: 500000\nusage_stats:\n  enabled: false\n"
