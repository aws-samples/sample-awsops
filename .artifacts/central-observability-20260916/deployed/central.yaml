  name: prometheus
  namespace: central-observability
---
apiVersion: v1
data:
  config.yaml: "extensions:\n  health_check:\n    endpoint: 0.0.0.0:13133\n  file_storage:\n\
    \    directory: /data/queue\n    create_directory: true\nreceivers:\n  otlp:\n\
    \    protocols:\n      grpc:\n        endpoint: 0.0.0.0:4317\n        tls:\n \
    \         cert_file: /tls/tls.crt\n          key_file: /tls/tls.key\n        \
    \  client_ca_file: /tls/ca.crt\nprocessors:\n  memory_limiter:\n    check_interval:\
    \ 1s\n    limit_mib: 1500\n    spike_limit_mib: 256\n  batch:\n    timeout: 5s\n\
    \    send_batch_size: 2048\n    send_batch_max_size: 4096\nexporters:\n  otlp/tempo:\n\
    \    endpoint: tempo:4317\n    tls:\n      insecure: true\n    sending_queue:\n\
    \      enabled: true\n      queue_size: 2000\n      storage: file_storage\n  \
    \    num_consumers: 2\n    retry_on_failure:\n      enabled: true\n      max_elapsed_time:\
    \ 0s\n  otlp/jaeger:\n    endpoint: jaeger:4317\n    tls:\n      insecure: true\n\
    \    sending_queue:\n      enabled: true\n      queue_size: 2000\n      storage:\
    \ file_storage\n      num_consumers: 2\n    retry_on_failure:\n      enabled:\
    \ true\n      max_elapsed_time: 0s\n  clickhouse:\n    endpoint: tcp://clickhouse:9000\n\
    \    username: telemetry\n    password: ${file:/auth/password}\n    database:\
    \ otel\n    create_schema: true\n    ttl: 168h\n    async_insert: true\n    timeout:\
    \ 15s\n    sending_queue:\n      enabled: true\n      queue_size: 2000\n     \
    \ storage: file_storage\n      num_consumers: 2\n    retry_on_failure:\n     \
    \ enabled: true\n      max_elapsed_time: 0s\n  prometheusremotewrite/prometheus:\n\
    \    endpoint: http://prometheus:9090/api/v1/write\n    resource_to_telemetry_conversion:\n\
    \      enabled: true\n    retry_on_failure:\n      enabled: true\n      max_elapsed_time:\
    \ 0s\n  prometheusremotewrite/mimir:\n    endpoint: http://mimir:9009/api/v1/push\n\
    \    resource_to_telemetry_conversion:\n      enabled: true\n    retry_on_failure:\n\
    \      enabled: true\n      max_elapsed_time: 0s\n  otlphttp/loki:\n    endpoint:\
    \ http://loki:3100/otlp\n    sending_queue:\n      enabled: true\n      queue_size:\
    \ 2000\n      storage: file_storage\n      num_consumers: 2\n    retry_on_failure:\n\
    \      enabled: true\n      max_elapsed_time: 0s\nconnectors:\n  routing/metrics:\n\
    \    error_mode: propagate\n    table:\n    - condition: resource.attributes[\"\
    k8s.cluster.name\"] == \"GPU01\"\n      action: move\n      pipelines:\n     \
    \ - metrics/prometheus\n    - condition: resource.attributes[\"k8s.cluster.name\"\
    ] == \"appmesh-lattice-mig\"\n      action: move\n      pipelines:\n      - metrics/prometheus\n\
    \    - condition: resource.attributes[\"k8s.cluster.name\"] == \"ekscluster01-iptables\"\
    \n      action: move\n      pipelines:\n      - metrics/prometheus\n    - condition:\
    \ resource.attributes[\"k8s.cluster.name\"] == \"ekscluster01-ipvs\"\n      action:\
    \ move\n      pipelines:\n      - metrics/mimir\n    - condition: resource.attributes[\"\
    k8s.cluster.name\"] == \"ekscluster01-nftables\"\n      action: move\n      pipelines:\n\
    \      - metrics/mimir\n    - condition: resource.attributes[\"k8s.cluster.name\"\
    ] == \"eksworkshop\"\n      action: move\n      pipelines:\n      - metrics/mimir\n\
    \    - condition: resource.attributes[\"k8s.cluster.name\"] == \"gpu-cluster-01\"\
    \n      action: move\n      pipelines:\n      - metrics/mimir\n    - condition:\
    \ resource.attributes[\"k8s.cluster.name\"] == \"platform-cluster\"\n      action:\
    \ move\n      pipelines:\n      - metrics/prometheus\n  routing/logs:\n    error_mode:\
    \ propagate\n    table:\n    - condition: resource.attributes[\"k8s.cluster.name\"\
    ] == \"GPU01\"\n      action: move\n      pipelines:\n      - logs/clickhouse\n\
    \    - condition: resource.attributes[\"k8s.cluster.name\"] == \"appmesh-lattice-mig\"\
    \n      action: move\n      pipelines:\n      - logs/loki\n    - condition: resource.attributes[\"\
    k8s.cluster.name\"] == \"ekscluster01-iptables\"\n      action: move\n      pipelines:\n\
    \      - logs/loki\n    - condition: resource.attributes[\"k8s.cluster.name\"\
    ] == \"ekscluster01-ipvs\"\n      action: move\n      pipelines:\n      - logs/loki\n\
    \    - condition: resource.attributes[\"k8s.cluster.name\"] == \"ekscluster01-nftables\"\
    \n      action: move\n      pipelines:\n      - logs/clickhouse\n    - condition:\
    \ resource.attributes[\"k8s.cluster.name\"] == \"eksworkshop\"\n      action:\
    \ move\n      pipelines:\n      - logs/clickhouse\n    - condition: resource.attributes[\"\
    k8s.cluster.name\"] == \"gpu-cluster-01\"\n      action: move\n      pipelines:\n\
    \      - logs/clickhouse\n    - condition: resource.attributes[\"k8s.cluster.name\"\
    ] == \"platform-cluster\"\n      action: move\n      pipelines:\n      - logs/loki\n\
    \  routing/traces:\n    error_mode: propagate\n    table:\n    - condition: resource.attributes[\"\
    k8s.cluster.name\"] == \"GPU01\"\n      action: move\n      pipelines:\n     \
    \ - traces/tempo\n    - condition: resource.attributes[\"k8s.cluster.name\"] ==\
    \ \"appmesh-lattice-mig\"\n      action: move\n      pipelines:\n      - traces/jaeger\n\
    \    - condition: resource.attributes[\"k8s.cluster.name\"] == \"ekscluster01-iptables\"\
    \n      action: move\n      pipelines:\n      - traces/tempo\n    - condition:\
    \ resource.attributes[\"k8s.cluster.name\"] == \"ekscluster01-ipvs\"\n      action:\
    \ move\n      pipelines:\n      - traces/jaeger\n    - condition: resource.attributes[\"\
    k8s.cluster.name\"] == \"ekscluster01-nftables\"\n      action: move\n      pipelines:\n\
    \      - traces/clickhouse\n    - condition: resource.attributes[\"k8s.cluster.name\"\
    ] == \"eksworkshop\"\n      action: move\n      pipelines:\n      - traces/tempo\n\
    \    - condition: resource.attributes[\"k8s.cluster.name\"] == \"gpu-cluster-01\"\
    \n      action: move\n      pipelines:\n      - traces/jaeger\n    - condition:\
    \ resource.attributes[\"k8s.cluster.name\"] == \"platform-cluster\"\n      action:\
    \ move\n      pipelines:\n      - traces/clickhouse\nservice:\n  extensions:\n\
    \  - health_check\n  - file_storage\n  pipelines:\n    metrics/input:\n      receivers:\n\
    \      - otlp\n      processors:\n      - memory_limiter\n      exporters:\n \
    \     - routing/metrics\n    metrics/mimir:\n      receivers:\n      - routing/metrics\n\
    \      processors:\n      - batch\n      exporters:\n      - prometheusremotewrite/mimir\n\
    \    metrics/prometheus:\n      receivers:\n      - routing/metrics\n      processors:\n\
    \      - batch\n      exporters:\n      - prometheusremotewrite/prometheus\n \
    \   logs/input:\n      receivers:\n      - otlp\n      processors:\n      - memory_limiter\n\
    \      exporters:\n      - routing/logs\n    logs/clickhouse:\n      receivers:\n\
    \      - routing/logs\n      processors:\n      - batch\n      exporters:\n  \
    \    - clickhouse\n    logs/loki:\n      receivers:\n      - routing/logs\n  \
    \    processors:\n      - batch\n      exporters:\n      - otlphttp/loki\n   \
    \ traces/input:\n      receivers:\n      - otlp\n      processors:\n      - memory_limiter\n\
    \      exporters:\n      - routing/traces\n    traces/clickhouse:\n      receivers:\n\
    \      - routing/traces\n      processors:\n      - batch\n      exporters:\n\
    \      - clickhouse\n    traces/jaeger:\n      receivers:\n      - routing/traces\n\
    \      processors:\n      - batch\n      exporters:\n      - otlp/jaeger\n   \
    \ traces/tempo:\n      receivers:\n      - routing/traces\n      processors:\n\
    \      - batch\n      exporters:\n      - otlp/tempo\n"
