apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations: {}
  name: clickhouse
  namespace: central-observability
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: clickhouse
  serviceName: clickhouse
  template:
    metadata:
      annotations:
        checksum/config: 9ffc6cd9c6832f84d265b658641ee8d69ba017c6d9cc8cf64952128f56c430b7
      labels:
        app: clickhouse
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - --config-file=/etc/clickhouse-server/config.xml
        command:
        - clickhouse-server
        image: clickhouse/clickhouse-server:26.8.5.13
        imagePullPolicy: IfNotPresent
        name: clickhouse
        ports:
        - containerPort: 8123
          name: http
          protocol: TCP
        - containerPort: 9000
          name: native
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /ping
            port: 8123
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            memory: 3Gi
          requests:
            cpu: 500m
            memory: 3Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /ping
            port: 8123
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/clickhouse-server/config.d/telemetry.xml
          name: config
          subPath: telemetry.xml
        - mountPath: /etc/clickhouse-server/users.d/telemetry.xml
          name: users
          subPath: users.xml
        - mountPath: /data
          name: data
        workingDir: /data
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/arch: arm64
        kubernetes.io/os: linux
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 101
        runAsGroup: 101
        runAsUser: 101
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: clickhouse
        name: config
      - name: users
        secret:
          defaultMode: 420
          secretName: clickhouse-auth
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 60Gi
      storageClassName: telemetry-gp3
      volumeMode: Filesystem
    status:
      phase: Pending
