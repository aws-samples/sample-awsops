name: Deploy Web

# Branch-split CI/CD:
#   main -> environment `production`  (awsops.samples.whchoi.net stack)
#   dev  -> environment `development` (awsops.dev.whchoi.net stack)
# Each branch restores its stack's terraform backend from repo-level secrets
# with distinct names (a dev job can never fall back to prod secrets):
#   main: TF_BACKEND_HCL     / TF_TFVARS
#   dev:  TF_BACKEND_HCL_DEV / TF_TFVARS_DEV
# The environments gate ONLY the `deploy` (mutation) job — `build` must stay
# automatic, so it carries no `environment:` (a gated one would pause it).
# The stack's own terraform outputs (ecr_web_uri, ecs_cluster_name,
# ecs_service_name, public_url) provide the per-environment ECR repo, service
# and smoke-test domain, so nothing environment-specific is hardcoded here.
#
# Mutation gate: `build` runs on every push and only publishes an image
# (ci-build, ECR push only) — it never touches the running ECS service.
# `deploy` (the actual `ecs update-service --force-new-deployment`, ci-deployer)
# runs automatically after a dev-branch build (continuous deploy on dev), but
# for main it stays workflow_dispatch-only behind the `production` environment
# and its protection rules. The approval is bound to a concrete image by tag
# discipline: build pushes ONLY the immutable web-<sha> tag and never touches
# :web-latest — the deploy job's pin step (inside the environment gate) is the
# ONLY writer of :web-latest. A build landing mid-approval can't swap the
# payload, and later ECS task churn (scale-out, ADR-015 restarts) re-resolves
# :web-latest to the last APPROVED image, never to an unapproved build. Mirrors scripts/v2/deploy.mjs's
# build+push+roll+wait+smoke steps, split across the two jobs/roles.

on:
  push:
    branches: [main, dev]
    paths: ["web/**", "CHANGELOG.md"]
  workflow_dispatch:
    inputs:
      image_sha:
        description: "Full commit SHA whose web-<sha> image to promote and roll (default: the dispatched ref's HEAD)"
        required: false

permissions:
  contents: read
  id-token: write

# Concurrency is declared PER JOB, not per workflow, on purpose: GitHub
# replaces (cancels) a PENDING run in a group even with
# cancel-in-progress:false, so a workflow-level group would let a main push
# (build-only run) cancel a dispatched production rollout waiting on the
# environment's reviewer approval. With per-job groups, a push's skipped
# deploy job never enters the rollout group at all. Within each group: dev is
# newest-wins (an older run can never roll a stale image after a newer one);
# main queues, and only another production dispatch can replace a pending one.

jobs:
  build:
    name: Build & push (arm64)
    if: github.event_name == 'push'
    runs-on: sample-awsops
    concurrency:
      group: deploy-web-build-${{ github.ref_name }}
      cancel-in-progress: ${{ github.ref_name != 'main' }}
    env:
      TF_BACKEND_HCL_B64: ${{ github.ref_name == 'main' && secrets.TF_BACKEND_HCL || secrets.TF_BACKEND_HCL_DEV }}
      TF_TFVARS_B64: ${{ github.ref_name == 'main' && secrets.TF_TFVARS || secrets.TF_TFVARS_DEV }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC -> ci-build)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_BUILD_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Restore terraform.foundation backend (read-only — just need `output`)
        working-directory: terraform/foundation
        run: |
          if [ -z "$TF_BACKEND_HCL_B64" ]; then
            echo "::error::This environment's TF backend secrets are not set — run 'make configure' once for this stack, see terraform.yml's header comment."
            exit 1
          fi
          echo "$TF_BACKEND_HCL_B64" | base64 -d > backend.hcl
          echo "$TF_TFVARS_B64" | base64 -d > terraform.tfvars
          terraform init -backend-config=backend.hcl -input=false

      - name: Resolve ECR repo URI
        id: tf
        working-directory: terraform/foundation
        run: echo "ecr_web_uri=$(terraform output -raw ecr_web_uri)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Copy CHANGELOG into build context
        # web/ is the build context but CHANGELOG.md lives at repo root and is
        # gitignored inside web/ — same reasoning as scripts/v2/deploy.mjs.
        run: cp CHANGELOG.md web/CHANGELOG.md

      - name: Build and push (arm64)
        uses: docker/build-push-action@v6
        with:
          context: web
          platforms: linux/arm64
          push: true
          # ONLY the immutable per-commit tag. :web-latest (what the ECS task
          # definition pulls) is promoted exclusively by the deploy job's pin
          # step, inside the environment gate — so the tag ECS resolves on any
          # task start (rollout, scale-out, ADR-015 self-healing restart) can
          # only ever be an image a deploy was approved for.
          tags: ${{ steps.tf.outputs.ecr_web_uri }}:web-${{ github.sha }}

  deploy:
    name: Roll ECS service
    # dev: continuous deploy right after a successful build.
    # main: workflow_dispatch only (production environment gates it).
    needs: [build]
    if: >-
      !cancelled() &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' || github.ref_name == 'dev')
    runs-on: sample-awsops
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    concurrency:
      group: deploy-web-rollout-${{ github.ref_name }}
      cancel-in-progress: ${{ github.ref_name != 'main' }}
    env:
      TF_BACKEND_HCL_B64: ${{ github.ref_name == 'main' && secrets.TF_BACKEND_HCL || secrets.TF_BACKEND_HCL_DEV }}
      TF_TFVARS_B64: ${{ github.ref_name == 'main' && secrets.TF_TFVARS || secrets.TF_TFVARS_DEV }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC -> ci-deployer)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_DEPLOYER_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Restore terraform.foundation backend
        working-directory: terraform/foundation
        run: |
          if [ -z "$TF_BACKEND_HCL_B64" ]; then
            echo "::error::This environment's TF backend secrets are not set — see terraform.yml's header comment."
            exit 1
          fi
          echo "$TF_BACKEND_HCL_B64" | base64 -d > backend.hcl
          echo "$TF_TFVARS_B64" | base64 -d > terraform.tfvars
          terraform init -backend-config=backend.hcl -input=false

      - name: Resolve ECS cluster/service/URL + ECR repo
        id: tf
        working-directory: terraform/foundation
        run: |
          echo "cluster=$(terraform output -raw ecs_cluster_name)" >> "$GITHUB_OUTPUT"
          echo "service=$(terraform output -raw ecs_service_name)" >> "$GITHUB_OUTPUT"
          echo "url=$(terraform output -raw public_url)" >> "$GITHUB_OUTPUT"
          echo "ecr_repo=$(terraform output -raw ecr_web_uri | sed 's|^[^/]*/||')" >> "$GITHUB_OUTPUT"

      - name: Pin web-latest to the approved image
        # The task definition references :web-latest, and this step is that
        # tag's ONLY writer (build never touches it). Point it at the EXACT
        # web-<sha> image this run was approved for (dispatch input,
        # defaulting to the dispatched ref's HEAD; the run's own commit on
        # dev pushes) before rolling.
        env:
          PIN_SHA: ${{ inputs.image_sha || github.sha }}
        run: |
          MANIFEST=$(aws ecr batch-get-image \
            --repository-name "${{ steps.tf.outputs.ecr_repo }}" \
            --image-ids imageTag="web-${PIN_SHA}" \
            --region ap-northeast-2 \
            --query 'images[0].imageManifest' --output text)
          if [ -z "$MANIFEST" ] || [ "$MANIFEST" = "None" ]; then
            echo "::error::No image tagged web-${PIN_SHA} in ${{ steps.tf.outputs.ecr_repo }} — build it first (push, or dispatch with a built SHA)."
            exit 1
          fi
          # put-image errors with ImageAlreadyExistsException when web-latest
          # already points at this manifest — that's success for our purposes.
          OUT=$(aws ecr put-image \
            --repository-name "${{ steps.tf.outputs.ecr_repo }}" \
            --image-tag web-latest \
            --image-manifest "$MANIFEST" \
            --region ap-northeast-2 2>&1) || {
              echo "$OUT" | grep -q ImageAlreadyExistsException || { echo "$OUT" >&2; exit 1; }
            }
          echo "web-latest -> web-${PIN_SHA}"

      - name: ECS force-new-deployment
        run: |
          aws ecs update-service \
            --cluster "${{ steps.tf.outputs.cluster }}" \
            --service "${{ steps.tf.outputs.service }}" \
            --force-new-deployment \
            --region ap-northeast-2 >/dev/null

      - name: Wait for services-stable
        run: |
          aws ecs wait services-stable \
            --cluster "${{ steps.tf.outputs.cluster }}" \
            --services "${{ steps.tf.outputs.service }}" \
            --region ap-northeast-2

      - name: Smoke test
        run: curl -fsS --max-time 15 "${{ steps.tf.outputs.url }}/api/health" && echo
