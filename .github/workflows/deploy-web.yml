name: Deploy Web

# SINGLE-REPO branch-split pipeline:
#   dev  -> DEV stack (awsops-dev.whchoi.net) — continuous deploy on push
#   main -> PRODUCTION stack (domain pending — CloudFront default until
#           decided); build on push, ECS roll is workflow_dispatch-only behind
#           the `production` environment's reviewer approval
# Stack selection is purely by distinctly-NAMED repo secrets (a dev job can
# never fall back to production secrets):
#   main: TF_BACKEND_HCL     / TF_TFVARS
#   dev:  TF_BACKEND_HCL_DEV / TF_TFVARS_DEV
# Secrets are repo-level, not environment-scoped: `build` must run ungated
# (an environment's reviewer would pause it); environments gate ONLY the
# mutation `deploy` job. Per-user previews are a separate workflow
# (deploy-preview.yml). Fork PRs never reach this workflow (push/dispatch
# triggers only), and GitHub denies fork runs secrets and id-token anyway.
#
# The stack's own terraform outputs (ecr_web_uri, ecs_cluster_name,
# ecs_service_name, public_url) provide the per-branch ECR repo, service and
# smoke domain — nothing environment-specific is hardcoded, so attaching the
# production domain later changes nothing here.
#
# Approval is bound to a concrete image by tag discipline: build pushes ONLY
# the immutable web-<sha> tag and never touches :web-latest — the deploy job's
# pin step is the ONLY writer of :web-latest. A build landing mid-approval
# can't swap the payload, and later ECS task churn (scale-out, ADR-015
# restarts) re-resolves :web-latest to the last pinned image.

on:
  push:
    branches: [main, dev]
    paths: ["web/**", "CHANGELOG.md"]
  workflow_dispatch:
    inputs:
      image_sha:
        description: "Full commit SHA whose web-<sha> image to promote and roll (default: the dispatched ref's HEAD)"
        required: false

permissions:
  contents: read
  id-token: write

# Concurrency is declared PER JOB with separate build/rollout groups: GitHub
# replaces a PENDING run in a group even with cancel-in-progress:false, so a
# workflow-level group would let a main push (build-only run) displace a
# dispatched production rollout waiting on reviewer approval. A push's skipped
# deploy job never enters the rollout group. dev is newest-wins; main queues.

jobs:
  build:
    name: Build & push (arm64)
    if: github.event_name == 'push'
    runs-on: sample-awsops
    concurrency:
      group: deploy-web-build-${{ github.ref_name }}
      cancel-in-progress: ${{ github.ref_name != 'main' }}
    env:
      TF_BACKEND_HCL_B64: ${{ github.ref_name == 'main' && secrets.TF_BACKEND_HCL || secrets.TF_BACKEND_HCL_DEV }}
      TF_TFVARS_B64: ${{ github.ref_name == 'main' && secrets.TF_TFVARS || secrets.TF_TFVARS_DEV }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC -> ci-build)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.ref_name == 'main' && vars.AWS_CI_BUILD_ROLE_ARN || vars.AWS_CI_BUILD_DEV_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Restore terraform.foundation backend (read-only — just need `output`)
        working-directory: terraform/foundation
        run: |
          if [ -z "$TF_BACKEND_HCL_B64" ]; then
            echo "::error::this branch's TF backend secrets are not set — run 'make configure' once for its stack (docs/runbooks/branch-strategy.md)."
            exit 1
          fi
          echo "$TF_BACKEND_HCL_B64" | base64 -d > backend.hcl
          echo "$TF_TFVARS_B64" | base64 -d > terraform.tfvars
          terraform init -backend-config=backend.hcl -input=false

      - name: Resolve ECR repo URI
        id: tf
        working-directory: terraform/foundation
        run: echo "ecr_web_uri=$(terraform output -raw ecr_web_uri)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Copy CHANGELOG into build context
        # web/ is the build context but CHANGELOG.md lives at repo root and is
        # gitignored inside web/ — same reasoning as scripts/v2/deploy.mjs.
        run: cp CHANGELOG.md web/CHANGELOG.md

      - name: Build and push (arm64)
        uses: docker/build-push-action@v6
        with:
          context: web
          platforms: linux/arm64
          push: true
          # ONLY the immutable per-commit tag — :web-latest is written solely
          # by the deploy job's pin step.
          tags: ${{ steps.tf.outputs.ecr_web_uri }}:web-${{ github.sha }}

  deploy:
    name: Roll ECS service
    # dev: continuous deploy right after its own build.
    # main: workflow_dispatch only (production environment gates it).
    needs: [build]
    if: >-
      !cancelled() &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' || github.ref_name == 'dev')
    runs-on: sample-awsops
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    concurrency:
      group: deploy-web-rollout-${{ github.ref_name }}
      cancel-in-progress: ${{ github.ref_name != 'main' }}
    env:
      TF_BACKEND_HCL_B64: ${{ github.ref_name == 'main' && secrets.TF_BACKEND_HCL || secrets.TF_BACKEND_HCL_DEV }}
      TF_TFVARS_B64: ${{ github.ref_name == 'main' && secrets.TF_TFVARS || secrets.TF_TFVARS_DEV }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC -> ci-deployer)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.ref_name == 'main' && vars.AWS_CI_DEPLOYER_ROLE_ARN || vars.AWS_CI_DEPLOYER_DEV_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Restore terraform.foundation backend
        working-directory: terraform/foundation
        run: |
          if [ -z "$TF_BACKEND_HCL_B64" ]; then
            echo "::error::this branch's TF backend secrets are not set — see docs/runbooks/branch-strategy.md."
            exit 1
          fi
          echo "$TF_BACKEND_HCL_B64" | base64 -d > backend.hcl
          echo "$TF_TFVARS_B64" | base64 -d > terraform.tfvars
          terraform init -backend-config=backend.hcl -input=false

      - name: Resolve ECS cluster/service/URL + ECR repo
        id: tf
        working-directory: terraform/foundation
        run: |
          echo "cluster=$(terraform output -raw ecs_cluster_name)" >> "$GITHUB_OUTPUT"
          echo "service=$(terraform output -raw ecs_service_name)" >> "$GITHUB_OUTPUT"
          echo "url=$(terraform output -raw public_url)" >> "$GITHUB_OUTPUT"
          echo "ecr_repo=$(terraform output -raw ecr_web_uri | sed 's|^[^/]*/||')" >> "$GITHUB_OUTPUT"

      - name: Pin web-latest to the approved image
        # The task definition references :web-latest, and this step is that
        # tag's ONLY writer (build never touches it). Point it at the EXACT
        # web-<sha> this run was approved for (dispatch input, defaulting to
        # the dispatched ref's HEAD; the run's own commit on dev pushes).
        # Caveat: the pin necessarily precedes the roll, so a roll that then
        # fails or is cancelled leaves :web-latest at the pinned-but-not-
        # stabilized image until the next run. Recovery: dispatch this
        # workflow with the image_sha you want live — the newest built sha to
        # go forward, or a previously stabilized sha to roll back. (Re-running
        # the failed run re-pins ITS OWN sha — safe only while nothing newer
        # has deployed since; prefer the explicit dispatch.)
        env:
          PIN_SHA: ${{ inputs.image_sha || github.sha }}
        run: |
          MANIFEST=$(aws ecr batch-get-image \
            --repository-name "${{ steps.tf.outputs.ecr_repo }}" \
            --image-ids imageTag="web-${PIN_SHA}" \
            --region ap-northeast-2 \
            --query 'images[0].imageManifest' --output text)
          if [ -z "$MANIFEST" ] || [ "$MANIFEST" = "None" ]; then
            echo "::error::No image tagged web-${PIN_SHA} in ${{ steps.tf.outputs.ecr_repo }} — build it first (push, or dispatch with a built SHA)."
            exit 1
          fi
          # put-image errors with ImageAlreadyExistsException when web-latest
          # already points at this manifest — that's success for our purposes.
          OUT=$(aws ecr put-image \
            --repository-name "${{ steps.tf.outputs.ecr_repo }}" \
            --image-tag web-latest \
            --image-manifest "$MANIFEST" \
            --region ap-northeast-2 2>&1) || {
              echo "$OUT" | grep -q ImageAlreadyExistsException || { echo "$OUT" >&2; exit 1; }
            }
          echo "web-latest -> web-${PIN_SHA}"

      - name: ECS force-new-deployment
        run: |
          aws ecs update-service \
            --cluster "${{ steps.tf.outputs.cluster }}" \
            --service "${{ steps.tf.outputs.service }}" \
            --force-new-deployment \
            --region ap-northeast-2 >/dev/null

      - name: Wait for services-stable
        run: |
          aws ecs wait services-stable \
            --cluster "${{ steps.tf.outputs.cluster }}" \
            --services "${{ steps.tf.outputs.service }}" \
            --region ap-northeast-2

      - name: Smoke test
        run: curl -fsS --max-time 15 "${{ steps.tf.outputs.url }}/api/health" && echo
