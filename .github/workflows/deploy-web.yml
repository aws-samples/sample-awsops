name: Deploy Web

# FIVE-BRANCH pipeline — one standing branch per tier/user, each with its own
# stack and domain:
#   main            -> production stack (domain pending — CloudFront default);
#                      build on push, ECS roll is dispatch-only behind the
#                      `production` environment's reviewer approval
#   dev             -> dev stack, awsops-dev.whchoi.net — continuous deploy
#   atomoh|ssminji|whchoi -> that user's stack, <user>.awsops-dev.whchoi.net —
#                      continuous deploy on push to their own branch
#
# Stack selection is an explicit per-branch case with hard-fail on missing
# config — NEVER an `expr && A || B` ternary, whose empty-value fallthrough
# would silently deploy against another stack. Secrets per stack:
#   main: TF_BACKEND_HCL / TF_TFVARS
#   dev:  TF_BACKEND_HCL_DEV / TF_TFVARS_DEV
#   user: TF_BACKEND_HCL_PREVIEW_<USER> / TF_TFVARS_PREVIEW_<USER>
# Roles: main uses the production build/deployer roles; dev and user branches
# use the dev-tier roles (permissions scoped to dev+user stacks, never
# production). Jobs WITH an `environment:` present the `environment:<name>`
# OIDC sub — the deployer roles' trust must match that, not a branch ref
# (see docs/runbooks/dev-repo-setup.md §2 for the full trust matrix).
#
# Fork PRs never reach this workflow (push/dispatch only) and GitHub denies
# fork runs secrets and id-token anyway.
#
# Dev provisions core first, builds immutable web/migration images using branch
# OIDC, then migrates and pins an ECS revision by digest using environment OIDC.
# Main/user branches retain their existing web-latest promotion procedure.

on:
  push:
    branches: [main, dev, atomoh, ssminji, whchoi]
    paths: ["web/**", "CHANGELOG.md", "terraform/foundation/**", "scripts/v2/ci/**", "scripts/v2/migrate*.mjs", "scripts/v2/initialize-db.mjs", "scripts/v2/package*.json", "scripts/v2/eks/rds-ca-bundle.pem", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:
    inputs:
      image_sha:
        description: "SHA to promote (main/user branches). Dev accepts only the dispatched dev SHA; use a revert commit for rollback."
        required: false
      build:
        description: "Build before rollout (main/user branches). Dev always builds or reuses this commit's immutable images."
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write

# Hold the dev lock across all three jobs and share it with manual Terraform
# apply. Other branches retain separate build/rollout locks below.
concurrency:
  group: ${{ github.ref_name == 'dev' && 'deployment-dev' || format('deploy-web-run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & push (arm64)
    if: github.ref_name != 'dev' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build))
    runs-on: sample-awsops
    concurrency:
      group: deploy-web-build-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      BRANCH: ${{ github.ref_name }}
      MAIN_ROLE: ${{ secrets.AWS_CI_BUILD_ROLE_ARN }}
      DEV_ROLE: ${{ secrets.AWS_CI_BUILD_DEV_ROLE_ARN }}
      MAIN_TFVARS_B64: ${{ secrets.TF_TFVARS }}
      DEV_TFVARS_B64: ${{ secrets.TF_TFVARS_DEV }}
      USER_TFVARS_B64: ${{ secrets[format('TF_TFVARS_PREVIEW_{0}', github.ref_name)] }}
    steps:
      - uses: actions/checkout@v4

      - name: Select the branch's stack (fail-closed — no cross-branch fallback)
        id: sel
        run: |
          case "$BRANCH" in
            main) ROLE="$MAIN_ROLE";;
            dev|atomoh|ssminji|whchoi) ROLE="$DEV_ROLE";;
            *) echo "::error::unexpected branch '$BRANCH'"; exit 1;;
          esac
          [ -n "$ROLE" ] || { echo "::error::build role variable for '$BRANCH' is not set"; exit 1; }
          echo "role=$ROLE" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC -> ci-build)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          mask-aws-account-id: true
          role-to-assume: ${{ steps.sel.outputs.role }}
          aws-region: ap-northeast-2

      # The build job needs exactly one stack fact — the web ECR repository —
      # and derives it WITHOUT reading Terraform state (the ci-build role is
      # ECR-push-only by design; no S3 tfstate access): repo name is
      # "${project}-web" (terraform/foundation/ecr.tf), project comes from the
      # stack's tfvars blob, registry from the ECR login below.
      - name: Resolve the stack's project name from tfvars
        id: stack
        run: |
          case "$BRANCH" in
            main) V="$MAIN_TFVARS_B64";;
            dev)  V="$DEV_TFVARS_B64";;
            atomoh|ssminji|whchoi) V="$USER_TFVARS_B64";;
            *) echo "::error::unexpected branch '$BRANCH'"; exit 1;;
          esac
          if [ -z "$V" ]; then
            echo "::error::TF tfvars secret for '$BRANCH' is not set — provision its stack first (docs/runbooks/branch-strategy.md). No cross-branch fallback, by design."
            exit 1
          fi
          PROJECT=$(echo "$V" | base64 -d | sed -nE 's/^[[:space:]]*project[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' | head -1)
          PROJECT="${PROJECT:-awsops-v2}"   # variables.tf default
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Copy CHANGELOG into build context
        # web/ is the build context but CHANGELOG.md lives at repo root and is
        # gitignored inside web/ — same reasoning as scripts/v2/deploy.mjs.
        run: cp CHANGELOG.md web/CHANGELOG.md

      - name: Build and push (arm64)
        uses: docker/build-push-action@v6
        with:
          context: web
          platforms: linux/arm64
          push: true
          # ONLY the immutable per-commit tag — :web-latest is written solely
          # by the deploy job's pin step.
          tags: ${{ steps.ecr.outputs.registry }}/${{ steps.stack.outputs.project }}-web:web-${{ github.sha }}

  deploy:
    name: Roll ECS service
    # main: workflow_dispatch only (production environment gates it).
    # dev + user branches: continuous deploy right after their own build.
    needs: [build]
    if: >-
      !cancelled() && github.ref_name != 'dev' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' || github.ref_name != 'main')
    runs-on: sample-awsops
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    concurrency:
      group: deployment-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      BRANCH: ${{ github.ref_name }}
      MAIN_ROLE: ${{ secrets.AWS_CI_DEPLOYER_ROLE_ARN }}
      DEV_ROLE: ${{ secrets.AWS_CI_DEPLOYER_DEV_ROLE_ARN }}
      MAIN_BACKEND_B64: ${{ secrets.TF_BACKEND_HCL }}
      MAIN_TFVARS_B64: ${{ secrets.TF_TFVARS }}
      DEV_BACKEND_B64: ${{ secrets.TF_BACKEND_HCL_DEV }}
      DEV_TFVARS_B64: ${{ secrets.TF_TFVARS_DEV }}
      USER_BACKEND_B64: ${{ secrets[format('TF_BACKEND_HCL_PREVIEW_{0}', github.ref_name)] }}
      USER_TFVARS_B64: ${{ secrets[format('TF_TFVARS_PREVIEW_{0}', github.ref_name)] }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Select the branch's stack (fail-closed — no cross-branch fallback)
        id: sel
        run: |
          case "$BRANCH" in
            main) ROLE="$MAIN_ROLE";;
            dev|atomoh|ssminji|whchoi) ROLE="$DEV_ROLE";;
            *) echo "::error::unexpected branch '$BRANCH'"; exit 1;;
          esac
          [ -n "$ROLE" ] || { echo "::error::deployer role variable for '$BRANCH' is not set"; exit 1; }
          echo "role=$ROLE" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC -> ci-deployer)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          mask-aws-account-id: true
          role-to-assume: ${{ steps.sel.outputs.role }}
          aws-region: ap-northeast-2

      - name: Restore terraform.foundation backend
        working-directory: terraform/foundation
        run: |
          case "$BRANCH" in
            main) B="$MAIN_BACKEND_B64"; V="$MAIN_TFVARS_B64";;
            dev)  B="$DEV_BACKEND_B64";  V="$DEV_TFVARS_B64";;
            atomoh|ssminji|whchoi) B="$USER_BACKEND_B64"; V="$USER_TFVARS_B64";;
            *) echo "::error::unexpected branch '$BRANCH'"; exit 1;;
          esac
          if [ -z "$B" ] || [ -z "$V" ]; then
            echo "::error::TF backend secrets for '$BRANCH' are not set — provision its stack first (docs/runbooks/branch-strategy.md). No cross-branch fallback, by design."
            exit 1
          fi
          echo "$B" | base64 -d > backend.hcl
          echo "$V" | base64 -d > terraform.tfvars
          terraform init -backend-config=backend.hcl -input=false

      - name: Resolve ECS cluster/service/URL + ECR repo
        id: tf
        working-directory: terraform/foundation
        run: |
          echo "cluster=$(terraform output -raw ecs_cluster_name)" >> "$GITHUB_OUTPUT"
          echo "service=$(terraform output -raw ecs_service_name)" >> "$GITHUB_OUTPUT"
          echo "url=$(terraform output -raw public_url)" >> "$GITHUB_OUTPUT"
          echo "ecr_repo=$(terraform output -raw ecr_web_uri | sed 's|^[^/]*/||')" >> "$GITHUB_OUTPUT"

      # The runner is persistent and shared — never leave the restored stack
      # config behind, whatever the outcome.
      - name: Clean restored terraform config off the runner
        if: always()
        working-directory: terraform/foundation
        run: rm -f terraform.tfvars backend.hcl

      - name: Pin web-latest to the approved image
        # The task definition references :web-latest, and this step is that
        # tag's ONLY writer (build never touches it). Point it at the EXACT
        # web-<sha> this run was approved for (dispatch input, defaulting to
        # the dispatched ref's HEAD; the run's own commit on branch pushes).
        # Caveat: the pin necessarily precedes the roll, so a roll that then
        # fails or is cancelled leaves :web-latest at the pinned-but-not-
        # stabilized image until the next run. Recovery: dispatch this
        # workflow with the image_sha you want live — the newest built sha to
        # go forward, or a previously stabilized sha to roll back. (Re-running
        # the failed run re-pins ITS OWN sha — safe only while nothing newer
        # has deployed since; prefer the explicit dispatch.)
        env:
          PIN_SHA: ${{ inputs.image_sha || github.sha }}
          DISPATCH_BUILD: ${{ inputs.build }}
          DISPATCH_IMAGE_SHA: ${{ inputs.image_sha }}
        run: |
          if [ "$DISPATCH_BUILD" = "true" ] && [ -n "$DISPATCH_IMAGE_SHA" ]; then
            echo "::error::'build' and 'image_sha' are mutually exclusive — a fresh build is always HEAD's sha."; exit 1
          fi
          MANIFEST=$(aws ecr batch-get-image \
            --repository-name "${{ steps.tf.outputs.ecr_repo }}" \
            --image-ids imageTag="web-${PIN_SHA}" \
            --region ap-northeast-2 \
            --query 'images[0].imageManifest' --output text)
          if [ -z "$MANIFEST" ] || [ "$MANIFEST" = "None" ]; then
            echo "::error::No image tagged web-${PIN_SHA} in ${{ steps.tf.outputs.ecr_repo }} — build it first (push, or dispatch with a built SHA)."
            exit 1
          fi
          # put-image errors with ImageAlreadyExistsException when web-latest
          # already points at this manifest — that's success for our purposes.
          OUT=$(aws ecr put-image \
            --repository-name "${{ steps.tf.outputs.ecr_repo }}" \
            --image-tag web-latest \
            --image-manifest "$MANIFEST" \
            --region ap-northeast-2 2>&1) || {
              echo "$OUT" | grep -q ImageAlreadyExistsException || { echo "$OUT" >&2; exit 1; }
            }
          echo "web-latest -> web-${PIN_SHA}"

      - name: ECS force-new-deployment
        run: |
          aws ecs update-service \
            --cluster "${{ steps.tf.outputs.cluster }}" \
            --service "${{ steps.tf.outputs.service }}" \
            --force-new-deployment \
            --region ap-northeast-2 >/dev/null

      - name: Wait for services-stable
        run: |
          aws ecs wait services-stable \
            --cluster "${{ steps.tf.outputs.cluster }}" \
            --services "${{ steps.tf.outputs.service }}" \
            --region ap-northeast-2

      - name: Smoke test
        run: curl -fsS --max-time 15 "${{ steps.tf.outputs.url }}/api/health" && echo

  dev-core:
    name: Dev core before DNS
    if: github.ref == 'refs/heads/dev'
    runs-on: sample-awsops
    timeout-minutes: 60
    environment: development
    env:
      TF_IN_AUTOMATION: 'true'
      TF_VAR_demo_password: ${{ secrets.TF_VAR_DEMO_PASSWORD }}
      IMAGE_SHA: ${{ inputs.image_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false
      - name: Deployment guard tests
        run: node --test scripts/v2/ci/*.test.mjs
      - name: Restore dev config (no fallback)
        env:
          BACKEND_B64: ${{ secrets.TF_BACKEND_HCL_DEV }}
          TFVARS_B64: ${{ secrets.TF_TFVARS_DEV }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$BACKEND_B64" && test -n "$TFVARS_B64"
          printf '%s' "$BACKEND_B64" | base64 -d > terraform/foundation/backend.hcl
          printf '%s' "$TFVARS_B64" | base64 -d > terraform/foundation/terraform.tfvars
          if grep -Eq '^[[:space:]]*admin_password[[:space:]]*=' terraform/foundation/terraform.tfvars; then
            echo '::error::Remove admin_password from tfvars'; exit 1
          fi
          mkdir -p terraform/foundation/.build/ci
          chmod 700 terraform/foundation/.build/ci
      - name: Deployer credentials (development environment OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          mask-aws-account-id: true
          role-to-assume: ${{ secrets.AWS_CI_DEPLOYER_DEV_ROLE_ARN }}
          role-duration-seconds: 3600
          aws-region: ap-northeast-2
      - name: Initialize and provision core (saved plan)
        run: |
          terraform -chdir=terraform/foundation init -backend-config=backend.hcl -input=false -lockfile=readonly
          node scripts/v2/ci/deploy-dev.mjs core
      - name: Remove private files
        if: always()
        run: |
          rm -f terraform/foundation/backend.hcl terraform/foundation/terraform.tfvars
          rm -rf terraform/foundation/.build terraform/foundation/.terraform

  dev-images:
    name: Dev immutable arm64 images
    needs: [dev-core]
    if: github.ref == 'refs/heads/dev'
    runs-on: sample-awsops
    timeout-minutes: 60
    # No environment: preserve the existing refs/heads/dev build-role OIDC sub.
    outputs:
      web_digest: ${{ steps.images.outputs.web_digest }}
      migration_digest: ${{ steps.images.outputs.migration_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build credentials (ECR only)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          mask-aws-account-id: true
          role-to-assume: ${{ secrets.AWS_CI_BUILD_DEV_ROLE_ARN }}
          aws-region: ap-northeast-2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build immutable arm64 web and migration images
        id: images
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/awsops-docker-${{ github.run_id }}
        run: node scripts/v2/ci/deploy-dev.mjs images
      - name: Remove build credentials and coordination files
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/awsops-docker-${{ github.run_id }}
        run: rm -rf terraform/foundation/.build "$DOCKER_CONFIG"

  dev-release:
    name: Dev migrate → private service → edge
    needs: [dev-images]
    if: github.ref == 'refs/heads/dev'
    runs-on: sample-awsops
    timeout-minutes: 120
    environment: development
    outputs:
      deployment_status: ${{ steps.edge.outputs.deployment_status }}
    env:
      TF_IN_AUTOMATION: 'true'
      TF_VAR_demo_password: ${{ secrets.TF_VAR_DEMO_PASSWORD }}
      SMOKE_SECRET_ARN: ${{ secrets.DEV_SMOKE_SECRET_ARN }}
      WEB_DIGEST: ${{ needs.dev-images.outputs.web_digest }}
      MIGRATION_DIGEST: ${{ needs.dev-images.outputs.migration_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false
      - name: Restore dev config (no fallback)
        env:
          BACKEND_B64: ${{ secrets.TF_BACKEND_HCL_DEV }}
          TFVARS_B64: ${{ secrets.TF_TFVARS_DEV }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$BACKEND_B64" && test -n "$TFVARS_B64"
          printf '%s' "$BACKEND_B64" | base64 -d > terraform/foundation/backend.hcl
          printf '%s' "$TFVARS_B64" | base64 -d > terraform/foundation/terraform.tfvars
          if grep -Eq '^[[:space:]]*admin_password[[:space:]]*=' terraform/foundation/terraform.tfvars; then
            echo '::error::Remove admin_password from tfvars'; exit 1
          fi
      - name: Deployer credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          mask-aws-account-id: true
          role-to-assume: ${{ secrets.AWS_CI_DEPLOYER_DEV_ROLE_ARN }}
          role-duration-seconds: 3600
          aws-region: ap-northeast-2
      - name: Migrate in VPC then roll and verify ECS
        run: |
          terraform -chdir=terraform/foundation init -backend-config=backend.hcl -input=false -lockfile=readonly
          node scripts/v2/ci/deploy-dev.mjs release
      - name: Refresh deployer credentials before edge
        uses: aws-actions/configure-aws-credentials@v4
        with:
          mask-aws-account-id: true
          role-to-assume: ${{ secrets.AWS_CI_DEPLOYER_DEV_ROLE_ARN }}
          role-duration-seconds: 3600
          aws-region: ap-northeast-2
      - name: Attach issued certificates and verify edge, or report awaiting_dns
        id: edge
        run: node scripts/v2/ci/deploy-dev.mjs edge
      - name: Remove private config, plans, generated archives and registry credentials
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/awsops-docker-${{ github.run_id }}
        run: |
          rm -f terraform/foundation/backend.hcl terraform/foundation/terraform.tfvars
          rm -rf terraform/foundation/.build terraform/foundation/.terraform "$DOCKER_CONFIG"
