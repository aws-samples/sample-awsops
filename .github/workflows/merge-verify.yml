name: Merge Verify

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  merge-verify:
    name: Merge Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Install Python test dependencies
        run: |
          python -m pip install \
            -r scripts/v2/requirements-test.txt \
            -r agent/requirements.txt \
            -r scripts/v2/incident/requirements.txt \
            -r scripts/v2/remediation/requirements.txt \
            -r scripts/v2/steampipe/requirements.txt \
            -r scripts/v2/workers/requirements.txt

      - name: Prepare isolated image codec for confinement checks
        id: codec
        run: |
          set -euo pipefail
          root=$(mktemp -d "$RUNNER_TEMP/awsops-codec.XXXXXX")
          echo "root=$root" >> "$GITHUB_OUTPUT"
          python3 scripts/pr-review/codec_sandbox.py prepare --state "$root/state.json"
          echo "AWSOPS_REVIEW_CODEC_STATE=$root/state.json" >> "$GITHUB_ENV"

      - name: Run merge verification
        run: bash scripts/v2/merge-verify.sh

      - name: Verify private migration runtime and controller offline
        run: |
          npm ci --prefix scripts/v2 --ignore-scripts --no-audit --no-fund
          node --test scripts/v2/ci/*.test.mjs

      - name: Verify migration and web DB connections against disposable PostgreSQL
        run: node --test scripts/v2/ci/migration.itest.mjs scripts/v2/ci/web-db-connection.itest.mjs

      - name: Verify mocked Terraform plans in an isolated tracked copy
        run: bash scripts/v2/terraform-test.sh

      - name: Remove owned codec containers and image tag
        if: always() && steps.codec.outputs.root != ''
        env:
          CODEC_ROOT: ${{ steps.codec.outputs.root }}
        run: |
          set -euo pipefail
          case "$CODEC_ROOT" in
            "$RUNNER_TEMP"/awsops-codec.*)
              rc=0
              if [ -f "$CODEC_ROOT/state.json" ]; then
                python3 scripts/pr-review/codec_sandbox.py cleanup --state "$CODEC_ROOT/state.json" || rc=$?
              fi
              rm -rf -- "$CODEC_ROOT"
              exit "$rc"
              ;;
            *) echo "::error::Unexpected codec cleanup path"; exit 1 ;;
          esac
