name: Deploy Guide to GitHub Pages

# Publishes docs-site/ (the Docusaurus user guide) to the repo's GitHub Pages
# site (Actions build_type; environment `github-pages` is restricted to the
# `dev` branch). Runs on the standard hosted `ubuntu-latest` runner — this
# repo has no self-hosted arm runner reserved for docs builds.
on:
  push:
    branches: [dev]
    paths:
      - 'docs-site/**'
      - '.github/workflows/deploy-guide.yml'
  workflow_dispatch:

# Least privilege: the build job (npm ci + third-party build code) gets
# read-only contents; only the deploy job can write Pages / mint an OIDC token.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          SITE_URL: ${{ vars.SITE_URL || 'https://aws-samples.github.io' }}
          BASE_URL: ${{ vars.BASE_URL || '/sample-awsops/' }}

      # Canary: fail loudly if the customer overview page is missing from the
      # build, so we never silently deploy an incomplete docs site again.
      - name: Verify build completeness
        run: |
          test -f build/sitemap.xml || { echo "::error::sitemap.xml missing"; exit 1; }
          if ! grep -q "overview/why-awsops" build/sitemap.xml; then
            echo "::error::overview/why-awsops missing from sitemap — build is incomplete"
            exit 1
          fi
          echo "Build verified: overview/why-awsops present in sitemap."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
