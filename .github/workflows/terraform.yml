name: Terraform

# terraform/foundation uses a partial S3 backend (backend.hcl) generated by
# `make configure` — gitignored, never committed. CI reconstructs it from
# base64 REPO-LEVEL secrets, one distinctly-named pair per stack:
#   main -> TF_BACKEND_HCL     / TF_TFVARS      (production stack)
#   dev  -> TF_BACKEND_HCL_DEV / TF_TFVARS_DEV  (dev stack, awsops-dev.whchoi.net)
# PR tests run without secrets/OIDC on a hosted runner. The required Plan check
# executes a real plan from the immutable PR base configuration, never PR code.
# Its summary distinguishes that source from the candidate SHA. A trusted push
# then plans the merged source and produces the only apply-eligible artifact.
# Missing stack configuration fails Plan; it never becomes a successful skip.
# Fork-PR guard: plan runs only for same-repo PRs — GitHub already denies fork
# runs secrets and id-token, and the fork's branch controls the workflow file
# on pull_request events, so we don't even start the job for forks.
#
# Mutation gate: `plan` is automatic (PR/push) and read-only (ci-terraform-plan,
# ReadOnlyAccess). `apply` is workflow_dispatch-only and applies the EXACT
# plan artifact from the run given in `plan_run_id` — never a fresh plan —
# matching terraform/CLAUDE.md's "no -auto-approve; saved-plan apply" rule.
# apply is gated per branch: dispatch from main -> `production` environment
# (reviewer approval); dispatch from dev -> `development` (no reviewer) —
# plus the saved-plan pinning in both cases.

on:
  pull_request:
    branches: [main, dev]
    paths: ["terraform/foundation/**", ".github/workflows/terraform.yml", ".github/workflows/deploy-web.yml", "scripts/v2/ci/**", "scripts/v2/migrate*.mjs", "scripts/v2/initialize-db.mjs"]
  push:
    branches: [main, dev, atomoh, ssminji, whchoi]
    # The workflow file itself is in the path filter so a workflow change
    # self-tests with a real plan on the branch it lands on.
    paths: ["terraform/foundation/**", ".github/workflows/terraform.yml", "scripts/v2/ci/**"]
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: "Run ID of the terraform.yml run whose plan artifact to apply"
        required: true
      reviewed_deletes:
        description: "Explicitly reviewed all deletes/replacements in this exact saved plan (never used by staged dev CI)"
        type: boolean
        default: false
        required: false
      reviewed_origin_bootstrap:
        description: "Reviewed first-origin bootstrap: exempt only the missing CloudFront managed-SG check; converge ingress with the next plan"
        type: boolean
        default: false
        required: false

permissions:
  contents: read

defaults:
  run:
    working-directory: terraform/foundation

jobs:
  guard-tests:
    name: Deployment guard tests
    if: >-
      github.event_name != 'workflow_dispatch' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test candidate without deployment credentials
        working-directory: .
        run: node --test scripts/v2/ci/*.test.mjs
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
          terraform_version: 1.15.7
      - name: Validate candidate Terraform without backend access
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate

  plan:
    name: Plan
    needs: [guard-tests]
    if: >-
      always() && github.event_name != 'workflow_dispatch' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: sample-awsops
    permissions:
      contents: read
      id-token: write
    # Only immutable trusted-base/push files execute in this credentialed job.
    env:
      TARGET: ${{ github.base_ref || github.ref_name }}
      PLAN_SOURCE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Require successful candidate tests
        working-directory: .
        env:
          TEST_RESULT: ${{ needs.guard-tests.result }}
        run: test "$TEST_RESULT" = success

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Verify and report the immutable plan source
        working-directory: .
        run: |
          set -euo pipefail
          [[ "$PLAN_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$PLAN_SOURCE_SHA"
          printf 'Plan source SHA: `%s`\nCandidate SHA: `%s`\n' "$PLAN_SOURCE_SHA" "$CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo 'This required check runs a real Terraform plan of the immutable trusted base. Candidate code is tested without credentials; the merged push must produce its own exact-SHA plan before apply.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
          terraform_version: 1.15.7

      - name: Configure AWS credentials (OIDC -> ci-terraform-plan)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          mask-aws-account-id: true
          role-to-assume: ${{ secrets.AWS_CI_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Verify the protected dev deployment account
        env:
          AWS_DEV_ACCOUNT_ID: ${{ secrets.AWS_DEV_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            dev|atomoh|ssminji|whchoi)
              [[ "$AWS_DEV_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || { echo '::error::Missing protected AWS_DEV_ACCOUNT_ID'; exit 1; }
              ACTUAL_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
              test "$ACTUAL_ACCOUNT" = "$AWS_DEV_ACCOUNT_ID" || { echo '::error::Deployment account mismatch'; exit 1; }
              ;;
          esac

      - name: Restore backend.hcl / terraform.tfvars
        env:
          MAIN_BACKEND_B64: ${{ secrets.TF_BACKEND_HCL }}
          MAIN_TFVARS_B64: ${{ secrets.TF_TFVARS }}
          DEV_BACKEND_B64: ${{ secrets.TF_BACKEND_HCL_DEV }}
          DEV_TFVARS_B64: ${{ secrets.TF_TFVARS_DEV }}
          USER_BACKEND_B64: ${{ secrets[format('TF_BACKEND_HCL_PREVIEW_{0}', github.base_ref || github.ref_name)] }}
          USER_TFVARS_B64: ${{ secrets[format('TF_TFVARS_PREVIEW_{0}', github.base_ref || github.ref_name)] }}
        run: |
          # Explicit per-branch case, hard-fail semantics — never an &&/|| ternary
          # whose empty-value fallthrough would plan against the other stack.
          case "$TARGET" in
            main) B="$MAIN_BACKEND_B64"; V="$MAIN_TFVARS_B64";;
            dev)  B="$DEV_BACKEND_B64";  V="$DEV_TFVARS_B64";;
            atomoh|ssminji|whchoi) B="$USER_BACKEND_B64"; V="$USER_TFVARS_B64";;
            *) echo "::error::unexpected target '$TARGET'"; exit 1;;
          esac
          if [ -z "$B" ] || [ -z "$V" ]; then
            echo "::error::TF backend/tfvars secrets for '$TARGET' are required for a real Plan check."
            exit 1
          fi
          umask 077
          echo "$B" | base64 -d > backend.hcl
          echo "$V" | base64 -d > terraform.tfvars
          # Guard the PASSWORD only: admin_email is not a secret (and k8sgpt.tf needs it
          # in tfvars when that flag is on); a per-stack demo_password override in the
          # stack's own tfvars blob is the sanctioned path, so it is not guarded either.
          if grep -Eq '^[[:space:]]*admin_password[[:space:]]*=' terraform.tfvars; then
            echo "::error::restored terraform.tfvars still contains admin_password — strip it and re-register the secret. Admins are not Terraform-managed: provision per stack with admin-create-user (docs/runbooks/dev-repo-setup.md)."
            exit 1
          fi

      - name: terraform init
        run: terraform init -backend-config=backend.hcl -input=false -lockfile=readonly

      - name: Prepare the trusted dev stage when supported
        working-directory: .
        env:
          AWS_DEV_ACCOUNT_ID: ${{ secrets.AWS_DEV_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = dev ] && [ -f scripts/v2/ci/deploy-dev.mjs ]; then
            GITHUB_SHA="$PLAN_SOURCE_SHA" node scripts/v2/ci/deploy-dev.mjs prepare
          else
            # The first PR's immutable base predates these helpers. Plan that
            # base's actual config normally; never execute a helper from the PR.
            echo 'Using the trusted source configuration without staged helper overrides.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: terraform plan
        env:
          # Sensitive inputs ride as TF_VAR_ env from masked secrets, never inside the
          # tfvars blob (public-repo logs are public; secrets are auto-masked). Scoped to
          # this one step so no other step (or PR-authored hook) sees them. The demo user
          # is deliberately one shared credential across stacks; admin users are per-stack
          # and NOT created by CI (create_admin_user defaults to false).
          TF_VAR_demo_password: ${{ secrets.TF_VAR_DEMO_PASSWORD }}
        # -lock=false: the plan role is ReadOnlyAccess by design and cannot write
        # the S3 lock object (use_lockfile → <key>.tflock, s3:PutObject). A
        # read-only plan needs no lock; apply (deployer role) still locks.
        run: |
          umask 077
          # Plan text can include non-sensitive-labelled credentials in providers;
          # keep it local too. Publish only the authenticated encrypted artifact.
          STAGE_ARGS=()
          if [ "$TARGET" = dev ] && [ -f .build/ci/variables.tfvars.json ]; then STAGE_ARGS+=(-var-file=.build/ci/variables.tfvars.json); fi
          terraform plan -out=tfplan -input=false -lock=false "${STAGE_ARGS[@]}" > tfplan.log 2>&1 || {
            echo '::error::Terraform plan failed; inspect the encrypted failure-diagnostics artifact'; exit 1;
          }

      # A plan file embeds every input variable value in plaintext (sensitive
      # ones included), and artifacts on a public repo are downloadable by any
      # GitHub account — encrypt before upload, fail-closed without the key.
      - name: Encrypt plan artifact
        if: github.event_name == 'push'
        env:
          TF_PLAN_ENC_KEY: ${{ secrets.TF_PLAN_ENC_KEY }}
        run: |
          [ -n "$TF_PLAN_ENC_KEY" ] || { echo "::error::TF_PLAN_ENC_KEY secret is not set — refusing to upload a plaintext plan."; exit 1; }
          node ../../scripts/v2/ci/plan-artifact.mjs seal
          rm -f tfplan

      - name: Upload plan artifact (encrypted)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/foundation/tfplan.enc
          retention-days: 5

      - name: Preserve encrypted failure diagnostics
        if: failure()
        id: diagnostics
        working-directory: .
        env:
          TF_PLAN_ENC_KEY: ${{ secrets.TF_PLAN_ENC_KEY }}
        run: |
          if [ -f scripts/v2/ci/failure-logs.mjs ]; then
            node scripts/v2/ci/failure-logs.mjs
          else
            # Immutable bootstrap bases predate the helper. Use only builtin
            # crypto here; never fetch or execute a helper from the PR.
            node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createCipheriv, randomBytes, scryptSync } from 'node:crypto';
          const files = ['terraform/foundation/tfplan.log', 'terraform/foundation/.build/ci/last-error.log'];
          const logs = Object.fromEntries(files.filter(p => fs.existsSync(p)).map(p => [path.basename(p), fs.readFileSync(p, 'utf8')]));
          const output = (key, value) => fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          output('encrypted', 'false');
          if (Object.keys(logs).length) {
            const parent = path.resolve(process.env.RUNNER_TEMP, '..', '.awsops-private-diagnostics');
            fs.mkdirSync(parent, {recursive:true, mode:0o700}); fs.chmodSync(parent, 0o700);
            const dir = fs.mkdtempSync(path.join(parent, 'failure-'));
            output('retained_dir', dir);
            for (const [name, text] of Object.entries(logs)) fs.writeFileSync(path.join(dir, name), text, {mode:0o600});
            if (!process.env.TF_PLAN_ENC_KEY) throw new Error(`Missing encryption key; diagnostics retained privately at ${dir}`);
            const salt=randomBytes(16), iv=randomBytes(12);
            const cipher=createCipheriv('aes-256-gcm', scryptSync(process.env.TF_PLAN_ENC_KEY,salt,32),iv);
            const metadata={kind:'failure-diagnostics',sha:process.env.PLAN_SOURCE_SHA,runId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT};
            const payload=JSON.stringify({metadata,plan:Buffer.from(JSON.stringify(logs)).toString('base64'),files:{}});
            const bytes=Buffer.concat([cipher.update(payload),cipher.final()]);
            const target=path.join(dir,'diagnostics.enc');
            fs.writeFileSync(target,Buffer.concat([salt,iv,cipher.getAuthTag(),bytes]),{mode:0o600});
            for (const name of Object.keys(logs)) fs.rmSync(path.join(dir,name));
            output('path',target); output('encrypted','true');
            console.log(`Encrypted diagnostics retained at ${dir}`);
          }
          JS
          fi
      - name: Upload encrypted failure diagnostics
        if: failure() && steps.diagnostics.outputs.encrypted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ steps.diagnostics.outputs.path }}
          retention-days: 5

      # Same principle as the apply job: the runner is persistent and shared —
      # never leave the plaintext plan (an encrypt-step failure strands it) or
      # the restored config behind, whatever the outcome.
      - name: Clean sensitive files off the runner
        if: always()
        working-directory: .
        run: |
          rm -f terraform/foundation/{tfplan,tfplan.enc,tfplan.log,terraform.tfvars,backend.hcl}
          rm -rf terraform/foundation/.build terraform/foundation/.terraform

  apply:
    name: Apply (saved plan)
    if: github.event_name == 'workflow_dispatch'
    runs-on: sample-awsops
    permissions:
      contents: read
      actions: read
      id-token: write
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    concurrency:
      group: deployment-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      TARGET: ${{ github.ref_name }}
      MAIN_ROLE: ${{ secrets.AWS_CI_DEPLOYER_ROLE_ARN }}
      DEV_ROLE: ${{ secrets.AWS_CI_DEPLOYER_DEV_ROLE_ARN }}
      MAIN_BACKEND_B64: ${{ secrets.TF_BACKEND_HCL }}
      MAIN_TFVARS_B64: ${{ secrets.TF_TFVARS }}
      DEV_BACKEND_B64: ${{ secrets.TF_BACKEND_HCL_DEV }}
      DEV_TFVARS_B64: ${{ secrets.TF_TFVARS_DEV }}
      USER_BACKEND_B64: ${{ secrets[format('TF_BACKEND_HCL_PREVIEW_{0}', github.ref_name)] }}
      USER_TFVARS_B64: ${{ secrets[format('TF_TFVARS_PREVIEW_{0}', github.ref_name)] }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
          terraform_version: 1.15.7

      - name: Select the branch's stack (fail-closed)
        id: sel
        run: |
          case "$TARGET" in
            main) ROLE="$MAIN_ROLE";;
            dev|atomoh|ssminji|whchoi) ROLE="$DEV_ROLE";;
            *) echo "::error::unexpected dispatch target '$TARGET'"; exit 1;;
          esac
          [ -n "$ROLE" ] || { echo "::error::deployer role secret for '$TARGET' is not set"; exit 1; }
          echo "role=$ROLE" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC -> ci-deployer)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          mask-aws-account-id: true
          role-to-assume: ${{ steps.sel.outputs.role }}
          aws-region: ap-northeast-2

      - name: Verify the protected dev apply account
        env:
          AWS_DEV_ACCOUNT_ID: ${{ secrets.AWS_DEV_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            dev|atomoh|ssminji|whchoi)
              [[ "$AWS_DEV_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || { echo '::error::Missing protected AWS_DEV_ACCOUNT_ID'; exit 1; }
              ACTUAL_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
              test "$ACTUAL_ACCOUNT" = "$AWS_DEV_ACCOUNT_ID" || { echo '::error::Deployment account mismatch'; exit 1; }
              ;;
          esac

      - name: Restore backend.hcl / terraform.tfvars
        run: |
          case "$TARGET" in
            main) B="$MAIN_BACKEND_B64"; V="$MAIN_TFVARS_B64";;
            dev)  B="$DEV_BACKEND_B64";  V="$DEV_TFVARS_B64";;
            atomoh|ssminji|whchoi) B="$USER_BACKEND_B64"; V="$USER_TFVARS_B64";;
            *) echo "::error::unexpected target '$TARGET'"; exit 1;;
          esac
          if [ -z "$B" ] || [ -z "$V" ]; then
            echo "::error::TF backend secrets for '$TARGET' are not set — see docs/runbooks/dev-repo-setup.md."
            exit 1
          fi
          umask 077
          echo "$B" | base64 -d > backend.hcl
          echo "$V" | base64 -d > terraform.tfvars
          # Guard the PASSWORD only: admin_email is not a secret (and k8sgpt.tf needs it
          # in tfvars when that flag is on); a per-stack demo_password override in the
          # stack's own tfvars blob is the sanctioned path, so it is not guarded either.
          if grep -Eq '^[[:space:]]*admin_password[[:space:]]*=' terraform.tfvars; then
            echo "::error::restored terraform.tfvars still contains admin_password — strip it and re-register the secret. Admins are not Terraform-managed: provision per stack with admin-create-user (docs/runbooks/dev-repo-setup.md)."
            exit 1
          fi

      - name: terraform init
        run: terraform init -backend-config=backend.hcl -input=false -lockfile=readonly

      - name: Download the approved plan
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          [[ "$PLAN_RUN_ID" =~ ^[0-9]+$ ]] || { echo '::error::Invalid run ID'; exit 1; }
          gh run download "$PLAN_RUN_ID" --repo "$GITHUB_REPOSITORY" --name tfplan --dir .

      - name: Authenticate provenance and decrypt the exact approved plan
        env:
          TF_PLAN_ENC_KEY: ${{ secrets.TF_PLAN_ENC_KEY }}
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          REVIEWED_DELETES: ${{ inputs.reviewed_deletes }}
          REVIEWED_ORIGIN_BOOTSTRAP: ${{ inputs.reviewed_origin_bootstrap }}
        run: |
          [ -n "$TF_PLAN_ENC_KEY" ] || { echo "::error::TF_PLAN_ENC_KEY secret is not set."; exit 1; }
          node ../../scripts/v2/ci/plan-artifact.mjs open

      - name: terraform apply (exact saved plan — never re-planned)
        run: |
          umask 077
          terraform apply -input=false tfplan > tfplan.log 2>&1 || {
            echo '::error::Saved-plan apply failed; inspect the encrypted failure-diagnostics artifact'; exit 1;
          }

      - name: Preserve encrypted failure diagnostics
        if: failure()
        id: diagnostics
        working-directory: .
        env:
          TF_PLAN_ENC_KEY: ${{ secrets.TF_PLAN_ENC_KEY }}
        run: node scripts/v2/ci/failure-logs.mjs
      - name: Upload encrypted failure diagnostics
        if: failure() && steps.diagnostics.outputs.encrypted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ steps.diagnostics.outputs.path }}
          retention-days: 5

      # The runner is persistent — never leave the decrypted plan (embeds sensitive
      # variable values in plaintext) or the restored config behind.
      - name: Clean sensitive files off the runner
        if: always()
        working-directory: .
        run: |
          rm -f terraform/foundation/{tfplan,tfplan.enc,tfplan.log,terraform.tfvars,backend.hcl}
          rm -rf terraform/foundation/.build terraform/foundation/.terraform
