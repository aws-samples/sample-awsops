name: Terraform

# terraform/foundation uses a partial S3 backend (backend.hcl) generated by
# `make configure` — gitignored, never committed. CI reconstructs it from the
# TF_BACKEND_HCL / TF_TFVARS repo secrets (base64 of the files `make configure`
# produced locally). Until those secrets are populated (one-time, after running
# `make configure` once against the real account), the plan/apply jobs below
# skip with a warning rather than fail outright — the platform enables this
# pipeline, but pulling the trigger on the foundation stack itself is a
# separate, deliberate step (see the platform repo's DESIGN.md).
#
# Mutation gate: `plan` is automatic (PR/push) and read-only (ci-terraform-plan,
# ReadOnlyAccess). `apply` is workflow_dispatch-only, gated by the
# `aws-samples-deploy` environment (human reviewer), and applies the EXACT plan
# artifact from the run given in `plan_run_id` — never a fresh plan — matching
# terraform/CLAUDE.md's "no -auto-approve; saved-plan apply by controller" rule.

on:
  pull_request:
    branches: [main]
    paths: ["terraform/foundation/**"]
  push:
    branches: [main]
    paths: ["terraform/foundation/**"]
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: "Run ID of the terraform.yml run whose plan artifact to apply"
        required: true

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: terraform/foundation

jobs:
  plan:
    name: Plan
    if: github.event_name != 'workflow_dispatch'
    runs-on: sample-awsops
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC -> ci-terraform-plan)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Restore backend.hcl / terraform.tfvars
        id: restore
        run: |
          if [ -z "${{ secrets.TF_BACKEND_HCL }}" ]; then
            echo "::warning::TF_BACKEND_HCL repo secret not set yet — run 'make configure' locally once against the real account, then store its backend.hcl and terraform.tfvars as base64 in the TF_BACKEND_HCL / TF_TFVARS repo secrets. Skipping plan until then."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "${{ secrets.TF_BACKEND_HCL }}" | base64 -d > backend.hcl
          echo "${{ secrets.TF_TFVARS }}" | base64 -d > terraform.tfvars

      - name: terraform init
        if: steps.restore.outputs.skip != '1'
        run: terraform init -backend-config=backend.hcl -input=false

      - name: terraform plan
        if: steps.restore.outputs.skip != '1'
        run: terraform plan -out=tfplan -input=false

      - name: Upload plan artifact
        if: steps.restore.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/foundation/tfplan
          retention-days: 5

  apply:
    name: Apply (saved plan)
    if: github.event_name == 'workflow_dispatch'
    runs-on: sample-awsops
    environment: aws-samples-deploy
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC -> ci-deployer)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_DEPLOYER_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Restore backend.hcl / terraform.tfvars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "${{ secrets.TF_BACKEND_HCL }}" | base64 -d > backend.hcl
          echo "${{ secrets.TF_TFVARS }}" | base64 -d > terraform.tfvars

      - name: terraform init
        run: terraform init -backend-config=backend.hcl -input=false

      - name: Download the approved plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.plan_run_id }}" --repo "${{ github.repository }}" --name tfplan --dir .

      - name: terraform apply (exact saved plan — never re-planned)
        run: terraform apply -input=false tfplan
