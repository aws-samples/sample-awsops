name: Terraform

# terraform/foundation uses a partial S3 backend (backend.hcl) generated by
# `make configure` — gitignored, never committed. CI reconstructs it from
# base64 REPO-LEVEL secrets, one distinctly-named pair per stack:
#   main -> TF_BACKEND_HCL     / TF_TFVARS      (production stack)
#   dev  -> TF_BACKEND_HCL_DEV / TF_TFVARS_DEV  (dev stack)
# Optional nonsecret repo variables DOMAIN_NAME_DEV / HOSTED_ZONE_NAME_DEV
# override only dev (including PR base dev); CERTIFICATE_MODE_DEV defaults to
# preserve. See docs/runbooks/dev-domain-rollout.md for the staged DNS gate.
# Repo-level, not environment-scoped: the automatic plan job must run ungated
# on PRs/pushes. Environments gate ONLY the dispatch-time apply. Until a
# stack's secrets are populated, its plan skips with a warning.
# Fork-PR guard: plan runs only for same-repo PRs — GitHub already denies fork
# runs secrets and id-token, and the fork's branch controls the workflow file
# on pull_request events, so we don't even start the job for forks.
#
# Mutation gate: `plan` is automatic (PR/push) and read-only (ci-terraform-plan,
# ReadOnlyAccess). `apply` is workflow_dispatch-only and applies the EXACT
# plan artifact from an explicit plan dispatch given in `plan_run_id` —
# automatic PR/push plans are advisory and cannot be applied —
# matching terraform/CLAUDE.md's "no -auto-approve; saved-plan apply" rule.
# apply is gated per branch: dispatch from main -> `production` environment
# (reviewer approval); dispatch from dev -> `development` (no reviewer) —
# plus the saved-plan pinning in both cases.

on:
  pull_request:
    branches: [main, dev]
    paths: ["terraform/foundation/**", ".github/workflows/terraform.yml", "scripts/v2/ci_plan_context.py", "scripts/v2/ci_dns_policy.py", "scripts/v2/ci_dev_domain.py", "scripts/v2/test_ci_*.py"]
  push:
    branches: [main, dev, atomoh, ssminji, whchoi]
    # The workflow file itself is in the path filter so a workflow change
    # self-tests with a real plan on the branch it lands on.
    paths: ["terraform/foundation/**", ".github/workflows/terraform.yml", "scripts/v2/ci_dns_policy.py", "scripts/v2/ci_dev_domain.py", "scripts/v2/test_ci_*.py"]
  workflow_dispatch:
    inputs:
      mode:
        description: "Create a fresh plan, or apply a verified saved plan"
        type: choice
        options: [plan, apply]
        default: plan
      plan_scope:
        description: "ECR bootstrap creates only the web image repository; full plans the stack"
        type: choice
        options: [full, ecr-bootstrap]
        default: full
      domain_rollout:
        description: "Plan only: scope dev/full DNS to the configured service and validation records"
        type: boolean
        default: false
      publish_service_dns:
        description: "Publish service A records (preserve current state when DNS changes are prohibited)"
        type: boolean
        default: true
      allow_dns_changes:
        description: "Permit DNS changes, including certificate validation; otherwise reuse issued certificates"
        type: boolean
        default: false
      existing_cf_certificate_arn:
        description: "Optional issued us-east-1 certificate to reuse without validation DNS"
        required: false
      existing_alb_certificate_arn:
        description: "Optional issued regional ALB certificate to reuse without validation DNS"
        required: false
      plan_run_id:
        description: "Successful plan dispatch run ID from this exact branch and SHA (push plans are advisory)"
        required: false

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: terraform/foundation

jobs:
  plan:
    name: Plan
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.mode == 'plan') &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: sample-awsops
    # plan is automatic and read-only — it must never sit behind any gate.
    env:
      TARGET: ${{ github.base_ref || github.ref_name }}
      MAIN_BACKEND_B64: ${{ secrets.TF_BACKEND_HCL }}
      MAIN_TFVARS_B64: ${{ secrets.TF_TFVARS }}
      DEV_BACKEND_B64: ${{ secrets.TF_BACKEND_HCL_DEV }}
      DEV_TFVARS_B64: ${{ secrets.TF_TFVARS_DEV }}
      USER_BACKEND_B64: ${{ secrets[format('TF_BACKEND_HCL_PREVIEW_{0}', github.base_ref || github.ref_name)] }}
      USER_TFVARS_B64: ${{ secrets[format('TF_TFVARS_PREVIEW_{0}', github.base_ref || github.ref_name)] }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC -> ci-terraform-plan)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          mask-aws-account-id: true
          role-to-assume: ${{ secrets.AWS_CI_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Restore backend.hcl / terraform.tfvars
        id: restore
        run: |
          # Explicit per-branch case, hard-fail semantics — never an &&/|| ternary
          # whose empty-value fallthrough would plan against the other stack.
          case "$TARGET" in
            main) B="$MAIN_BACKEND_B64"; V="$MAIN_TFVARS_B64";;
            dev)  B="$DEV_BACKEND_B64";  V="$DEV_TFVARS_B64";;
            atomoh|ssminji|whchoi) B="$USER_BACKEND_B64"; V="$USER_TFVARS_B64";;
            *) echo "::error::unexpected target '$TARGET'"; exit 1;;
          esac
          if [ -z "$B" ] || [ -z "$V" ]; then
            echo "::warning::TF backend secrets for '$TARGET' are not set yet — run 'make configure' once for that stack (docs/runbooks/dev-repo-setup.md). Skipping plan until then."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$B" | base64 -d > backend.hcl
          echo "$V" | base64 -d > terraform.tfvars
          # Guard the PASSWORD only: admin_email is not a secret (and k8sgpt.tf needs it
          # in tfvars when that flag is on); a per-stack demo_password override in the
          # stack's own tfvars blob is the sanctioned path, so it is not guarded either.
          if grep -Eq '^[[:space:]]*admin_password[[:space:]]*=' terraform.tfvars; then
            echo "::error::restored terraform.tfvars still contains admin_password — strip it and re-register the secret. Admins are not Terraform-managed: provision per stack with admin-create-user (docs/runbooks/dev-repo-setup.md)."
            exit 1
          fi

      - name: Configure dev domain overrides
        id: domain
        if: steps.restore.outputs.skip != '1'
        env:
          DOMAIN_NAME_DEV: ${{ vars.DOMAIN_NAME_DEV }}
          HOSTED_ZONE_NAME_DEV: ${{ vars.HOSTED_ZONE_NAME_DEV }}
          CERTIFICATE_MODE_DEV: ${{ vars.CERTIFICATE_MODE_DEV }}
          DOMAIN_ROLLOUT: ${{ github.event_name == 'workflow_dispatch' && inputs.domain_rollout }}
          PLAN_SCOPE: ${{ inputs.plan_scope || 'full' }}
        run: |
          set -euo pipefail
          # Never rewrite TF_TFVARS_DEV. Auto tfvars reach BOTH console and plan;
          # certificate choices stay in the later, explicitly passed var-file.
          tracked=$(git ls-files -- ci-domain.auto.tfvars.json)
          [ -z "$tracked" ] || { echo "::error::ci-domain.auto.tfvars.json is tracked; remove it from version control before planning"; exit 1; }
          rm -f ci-deployment.tfvars.json
          python3 ../../scripts/v2/ci_dev_domain.py overrides

      - name: terraform init
        if: steps.restore.outputs.skip != '1'
        run: terraform init -backend-config=backend.hcl -input=false

      - name: Check existing certificates without changing DNS
        id: dns
        if: steps.restore.outputs.skip != '1' && (github.event_name == 'workflow_dispatch' || env.TARGET == 'dev')
        env:
          CF_CERTIFICATE_ARN: ${{ inputs.existing_cf_certificate_arn }}
          ALB_CERTIFICATE_ARN: ${{ inputs.existing_alb_certificate_arn }}
          ALLOW_DNS_CHANGES: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_dns_changes }}
          PUBLISH_SERVICE_DNS: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_service_dns }}
          PLAN_SCOPE: ${{ inputs.plan_scope || 'full' }}
          CERTIFICATE_MODE: ${{ steps.domain.outputs.certificate_mode }}
          ADVISORY: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          umask 077
          STATE_JSON=ci-state.json
          trap 'rm -f "$STATE_JSON"' EXIT
          # show and console read state without locking or refreshing it.
          # console does NOT support -lock=false; verified against an offline backend.
          terraform show -json > "$STATE_JSON"
          terraform console -no-color \
            <<<'jsonencode({domain = var.domain_name, zone = var.hosted_zone_name, aliases = var.extra_domain_aliases, region = var.region, cf_arn = var.existing_cf_certificate_arn, alb_arn = var.existing_alb_certificate_arn, domain_rollout = var.ci_domain_rollout})' |
            python3 ../../scripts/v2/ci_dns_policy.py certificates \
              --state "$STATE_JSON" --allow-dns "$ALLOW_DNS_CHANGES" \
              --publish "$PUBLISH_SERVICE_DNS" --scope "$PLAN_SCOPE" \
              --cf-arn "$CF_CERTIFICATE_ARN" --alb-arn "$ALB_CERTIFICATE_ARN" \
              --target "$TARGET" --certificate-mode "${CERTIFICATE_MODE:-preserve}" \
              --advisory "$ADVISORY" \
              > ci-deployment.tfvars.json
          # JSON null preserves Terraform certificate ownership; "-var=...=null"
          # would instead pass the literal string "null" to a string variable.
          echo 'Certificate ownership and service DNS inputs (redacted):' >> "$GITHUB_STEP_SUMMARY"
          python3 ../../scripts/v2/ci_dns_policy.py summary \
            < ci-deployment.tfvars.json >> "$GITHUB_STEP_SUMMARY"

      - name: terraform plan
        if: steps.restore.outputs.skip != '1'
        env:
          # Sensitive inputs ride as TF_VAR_ env from masked secrets, never inside the
          # tfvars blob (public-repo logs are public; secrets are auto-masked). Scoped to
          # this one step so no other step (or PR-authored hook) sees them. The demo user
          # is deliberately one shared credential across stacks; admin users are per-stack
          # and NOT created by CI (create_admin_user defaults to false).
          TF_VAR_demo_password: ${{ secrets.TF_VAR_DEMO_PASSWORD }}
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          PLAN_SCOPE: ${{ inputs.plan_scope }}
        # -lock=false: the plan role is ReadOnlyAccess by design and cannot write
        # the S3 lock object (use_lockfile → <key>.tflock, s3:PutObject). A
        # read-only plan needs no lock; apply (deployer role) still locks.
        run: |
          set -euo pipefail
          args=(-out=tfplan -input=false -lock=false)
          if [ "$DISPATCH" = "true" ] || [ "$TARGET" = "dev" ]; then
            [ -s ci-deployment.tfvars.json ] || { echo "::error::verified deployment inputs are missing"; exit 1; }
            args+=(-var-file=ci-deployment.tfvars.json)
          fi
          if [ "$DISPATCH" = "true" ]; then
            case "$PLAN_SCOPE" in
              full) ;;
              ecr-bootstrap) args+=(-target=aws_ecr_repository.web);;
              *) echo "::error::unsupported plan scope"; exit 1;;
            esac
          fi
          terraform plan "${args[@]}"

      - name: Check planned DNS operations
        if: steps.restore.outputs.skip != '1'
        env:
          # Advisory DNS allowance is reporting only; these plans cannot be applied.
          # Dispatch plans need explicit permission independently of domain scoping.
          ALLOW_DNS_CHANGES: ${{ github.event_name != 'workflow_dispatch' || inputs.allow_dns_changes }}
          PLAN_SCOPE: ${{ inputs.plan_scope || 'full' }}
          ADVISORY: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          terraform show -json tfplan |
            python3 ../../scripts/v2/ci_dns_policy.py check-plan \
              --allow-dns "$ALLOW_DNS_CHANGES" --scope "$PLAN_SCOPE" \
              --target "$TARGET" --advisory "$ADVISORY" | tee -a "$GITHUB_STEP_SUMMARY"

      # A plan file embeds every input variable value in plaintext (sensitive
      # ones included), and artifacts on a public repo are downloadable by any
      # GitHub account — encrypt before upload, fail-closed without the key.
      - name: Encrypt plan artifact
        if: steps.restore.outputs.skip != '1'
        env:
          TF_PLAN_ENC_KEY: ${{ secrets.TF_PLAN_ENC_KEY }}
        run: |
          [ -n "$TF_PLAN_ENC_KEY" ] || { echo "::error::TF_PLAN_ENC_KEY secret is not set — refusing to upload a plaintext plan."; exit 1; }
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in tfplan -out tfplan.enc -pass env:TF_PLAN_ENC_KEY
          rm -f tfplan

      - name: Upload plan artifact (encrypted)
        if: steps.restore.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/foundation/tfplan.enc
          retention-days: 5

      # Same principle as the apply job: the runner is persistent and shared —
      # never leave the plaintext plan (an encrypt-step failure strands it) or
      # the restored config behind, whatever the outcome.
      - name: Clean sensitive files off the runner
        if: always()
        run: |
          set -euo pipefail
          rm -f tfplan tfplan.enc terraform.tfvars backend.hcl ci-deployment.tfvars.json ci-state.json
          # Preserve a tracked override for diagnosis if the generation guard refused it.
          tracked=$(git ls-files -- ci-domain.auto.tfvars.json)
          if [ -z "$tracked" ]; then rm -f ci-domain.auto.tfvars.json; fi

  apply:
    name: Apply (saved plan)
    permissions:
      actions: read
      contents: read
      id-token: write
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apply'
    runs-on: sample-awsops
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    env:
      TARGET: ${{ github.ref_name }}
      MAIN_ROLE: ${{ secrets.AWS_CI_DEPLOYER_ROLE_ARN }}
      DEV_ROLE: ${{ secrets.AWS_CI_DEPLOYER_DEV_ROLE_ARN }}
      MAIN_BACKEND_B64: ${{ secrets.TF_BACKEND_HCL }}
      MAIN_TFVARS_B64: ${{ secrets.TF_TFVARS }}
      DEV_BACKEND_B64: ${{ secrets.TF_BACKEND_HCL_DEV }}
      DEV_TFVARS_B64: ${{ secrets.TF_TFVARS_DEV }}
      USER_BACKEND_B64: ${{ secrets[format('TF_BACKEND_HCL_PREVIEW_{0}', github.ref_name)] }}
      USER_TFVARS_B64: ${{ secrets[format('TF_TFVARS_PREVIEW_{0}', github.ref_name)] }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify the saved plan belongs to this deployed commit and branch
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          set -euo pipefail
          [[ "$PLAN_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::plan_run_id is required"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PLAN_RUN_ID" |
            python3 ../../scripts/v2/ci_plan_context.py \
              --repository "$GITHUB_REPOSITORY" --branch "$TARGET" --commit "$GITHUB_SHA"
          CURRENT_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET" --jq '.object.sha')
          [ "$CURRENT_SHA" = "$GITHUB_SHA" ] || { echo "::error::branch moved; create and review a fresh plan"; exit 1; }

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false

      - name: Select the branch's stack (fail-closed)
        id: sel
        run: |
          case "$TARGET" in
            main) ROLE="$MAIN_ROLE";;
            dev|atomoh|ssminji|whchoi) ROLE="$DEV_ROLE";;
            *) echo "::error::unexpected dispatch target '$TARGET'"; exit 1;;
          esac
          [ -n "$ROLE" ] || { echo "::error::deployer role secret for '$TARGET' is not set"; exit 1; }
          echo "role=$ROLE" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC -> ci-deployer)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          mask-aws-account-id: true
          role-to-assume: ${{ steps.sel.outputs.role }}
          aws-region: ap-northeast-2

      - name: Restore backend.hcl / terraform.tfvars
        run: |
          case "$TARGET" in
            main) B="$MAIN_BACKEND_B64"; V="$MAIN_TFVARS_B64";;
            dev)  B="$DEV_BACKEND_B64";  V="$DEV_TFVARS_B64";;
            atomoh|ssminji|whchoi) B="$USER_BACKEND_B64"; V="$USER_TFVARS_B64";;
            *) echo "::error::unexpected target '$TARGET'"; exit 1;;
          esac
          if [ -z "$B" ] || [ -z "$V" ]; then
            echo "::error::TF backend secrets for '$TARGET' are not set — see docs/runbooks/dev-repo-setup.md."
            exit 1
          fi
          echo "$B" | base64 -d > backend.hcl
          echo "$V" | base64 -d > terraform.tfvars
          # Guard the PASSWORD only: admin_email is not a secret (and k8sgpt.tf needs it
          # in tfvars when that flag is on); a per-stack demo_password override in the
          # stack's own tfvars blob is the sanctioned path, so it is not guarded either.
          if grep -Eq '^[[:space:]]*admin_password[[:space:]]*=' terraform.tfvars; then
            echo "::error::restored terraform.tfvars still contains admin_password — strip it and re-register the secret. Admins are not Terraform-managed: provision per stack with admin-create-user (docs/runbooks/dev-repo-setup.md)."
            exit 1
          fi

      - name: terraform init
        run: terraform init -backend-config=backend.hcl -input=false

      - name: Download the approved plan
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          gh run download "$PLAN_RUN_ID" --repo "$GITHUB_REPOSITORY" --name tfplan --dir .

      - name: Decrypt the approved plan
        env:
          TF_PLAN_ENC_KEY: ${{ secrets.TF_PLAN_ENC_KEY }}
        run: |
          [ -n "$TF_PLAN_ENC_KEY" ] || { echo "::error::TF_PLAN_ENC_KEY secret is not set."; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in tfplan.enc -out tfplan -pass env:TF_PLAN_ENC_KEY

      - name: Recheck branch immediately before apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET" --jq '.object.sha')
          [ "$CURRENT_SHA" = "$GITHUB_SHA" ] || { echo "::error::branch moved; create and review a fresh plan"; exit 1; }

      - name: terraform apply (exact saved plan — never re-planned)
        env:
          ALLOW_DNS_CHANGES: ${{ inputs.allow_dns_changes }}
          PLAN_SCOPE: ${{ inputs.plan_scope }}
        run: |
          set -euo pipefail
          terraform show -json tfplan |
            python3 ../../scripts/v2/ci_dns_policy.py check-plan \
              --allow-dns "$ALLOW_DNS_CHANGES" --scope "$PLAN_SCOPE" --target "$TARGET"
          terraform apply -input=false tfplan

      # The runner is persistent — never leave the decrypted plan (embeds sensitive
      # variable values in plaintext) or the restored config behind.
      - name: Clean sensitive files off the runner
        if: always()
        run: rm -f tfplan tfplan.enc terraform.tfvars backend.hcl
