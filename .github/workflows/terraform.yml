name: Terraform

# terraform/foundation uses a partial S3 backend (backend.hcl) generated by
# `make configure` — gitignored, never committed. CI reconstructs it from
# base64 REPO-LEVEL secrets of the files `make configure` produced locally,
# one distinctly-NAMED pair per stack (distinct names on purpose — a dev-branch
# job can never fall back to the production stack's secrets):
#   main -> TF_BACKEND_HCL     / TF_TFVARS      (production stack)
#   dev  -> TF_BACKEND_HCL_DEV / TF_TFVARS_DEV  (development stack)
# They are repo-level, not environment-scoped: automatic jobs (plan, build)
# must run ungated on PRs/pushes, and an environment would both pause them on
# `production`'s required reviewer and reject PR merge refs via the
# environment's branch policy. The `production`/`development` environments
# gate ONLY the mutation jobs (apply / ECS roll / agentcore).
# Until a stack's secrets are populated, its plan job skips with a warning.
#
# Mutation gate: `plan` is automatic (PR/push) and read-only (ci-terraform-plan,
# ReadOnlyAccess). `apply` is workflow_dispatch-only, gated by the target
# environment (protection rules live on `production`), and applies the EXACT
# plan artifact from the run given in `plan_run_id` — never a fresh plan —
# matching terraform/CLAUDE.md's "no -auto-approve; saved-plan apply" rule.

on:
  pull_request:
    branches: [main, dev]
    paths: ["terraform/foundation/**"]
  push:
    branches: [main, dev]
    paths: ["terraform/foundation/**"]
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: "Run ID of the terraform.yml run whose plan artifact to apply"
        required: true

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: terraform/foundation

jobs:
  plan:
    name: Plan
    if: github.event_name != 'workflow_dispatch'
    runs-on: sample-awsops
    # No `environment:` here — plan is automatic and read-only; a gated
    # environment would pause it (required reviewer) and reject PR merge refs
    # (environment branch policy). Stack selection is by secret name only.
    env:
      TF_BACKEND_HCL_B64: ${{ (github.base_ref || github.ref_name) == 'main' && secrets.TF_BACKEND_HCL || secrets.TF_BACKEND_HCL_DEV }}
      TF_TFVARS_B64: ${{ (github.base_ref || github.ref_name) == 'main' && secrets.TF_TFVARS || secrets.TF_TFVARS_DEV }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC -> ci-terraform-plan)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Restore backend.hcl / terraform.tfvars
        id: restore
        run: |
          if [ -z "$TF_BACKEND_HCL_B64" ]; then
            echo "::warning::This environment's TF backend secrets are not set yet — run 'make configure' locally once against the target account/stack, then store its backend.hcl and terraform.tfvars as base64 in this environment's secrets (see the header comment). Skipping plan until then."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$TF_BACKEND_HCL_B64" | base64 -d > backend.hcl
          echo "$TF_TFVARS_B64" | base64 -d > terraform.tfvars

      - name: terraform init
        if: steps.restore.outputs.skip != '1'
        run: terraform init -backend-config=backend.hcl -input=false

      - name: terraform plan
        if: steps.restore.outputs.skip != '1'
        run: terraform plan -out=tfplan -input=false

      - name: Upload plan artifact
        if: steps.restore.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/foundation/tfplan
          retention-days: 5

  apply:
    name: Apply (saved plan)
    if: github.event_name == 'workflow_dispatch'
    runs-on: sample-awsops
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    env:
      TF_BACKEND_HCL_B64: ${{ github.ref_name == 'main' && secrets.TF_BACKEND_HCL || secrets.TF_BACKEND_HCL_DEV }}
      TF_TFVARS_B64: ${{ github.ref_name == 'main' && secrets.TF_TFVARS || secrets.TF_TFVARS_DEV }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC -> ci-deployer)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_DEPLOYER_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Restore backend.hcl / terraform.tfvars
        run: |
          if [ -z "$TF_BACKEND_HCL_B64" ]; then
            echo "::error::This environment's TF backend secrets are not set — see the header comment."
            exit 1
          fi
          echo "$TF_BACKEND_HCL_B64" | base64 -d > backend.hcl
          echo "$TF_TFVARS_B64" | base64 -d > terraform.tfvars

      - name: terraform init
        run: terraform init -backend-config=backend.hcl -input=false

      - name: Download the approved plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.plan_run_id }}" --repo "${{ github.repository }}" --name tfplan --dir .

      - name: terraform apply (exact saved plan — never re-planned)
        run: terraform apply -input=false tfplan
