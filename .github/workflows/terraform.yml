name: Terraform

# terraform/foundation uses a partial S3 backend (backend.hcl) generated by
# `make configure` — gitignored, never committed. CI reconstructs it from
# base64 REPO-LEVEL secrets, one distinctly-named pair per stack:
#   main -> TF_BACKEND_HCL     / TF_TFVARS      (production stack)
#   dev  -> TF_BACKEND_HCL_DEV / TF_TFVARS_DEV  (dev stack, awsops-dev.whchoi.net)
# Repo-level, not environment-scoped: the automatic plan job must run ungated
# on PRs/pushes. Environments gate ONLY the dispatch-time apply. Until a
# stack's secrets are populated, its plan skips with a warning.
# Fork-PR guard: plan runs only for same-repo PRs — GitHub already denies fork
# runs secrets and id-token, and the fork's branch controls the workflow file
# on pull_request events, so we don't even start the job for forks.
#
# Mutation gate: `plan` is automatic (PR/push) and read-only (ci-terraform-plan,
# ReadOnlyAccess). `apply` is workflow_dispatch-only and applies the EXACT
# plan artifact from the run given in `plan_run_id` — never a fresh plan —
# matching terraform/CLAUDE.md's "no -auto-approve; saved-plan apply" rule.
# apply is gated per branch: dispatch from main -> `production` environment
# (reviewer approval); dispatch from dev -> `development` (no reviewer) —
# plus the saved-plan pinning in both cases.

on:
  pull_request:
    branches: [main, dev]
    paths: ["terraform/foundation/**"]
  push:
    branches: [main, dev]
    paths: ["terraform/foundation/**"]
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: "Run ID of the terraform.yml run whose plan artifact to apply"
        required: true

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: terraform/foundation

jobs:
  plan:
    name: Plan
    if: >-
      github.event_name != 'workflow_dispatch' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: sample-awsops
    # plan is automatic and read-only — it must never sit behind any gate.
    env:
      TF_BACKEND_HCL_B64: ${{ (github.base_ref || github.ref_name) == 'main' && secrets.TF_BACKEND_HCL || secrets.TF_BACKEND_HCL_DEV }}
      TF_TFVARS_B64: ${{ (github.base_ref || github.ref_name) == 'main' && secrets.TF_TFVARS || secrets.TF_TFVARS_DEV }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC -> ci-terraform-plan)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Restore backend.hcl / terraform.tfvars
        id: restore
        run: |
          if [ -z "$TF_BACKEND_HCL_B64" ]; then
            echo "::warning::This repo's TF backend secrets are not set yet — run 'make configure' once for the dev stack, then store its backend.hcl and terraform.tfvars as base64 in the TF_BACKEND_HCL / TF_TFVARS repo secrets (see docs/runbooks/dev-repo-setup.md). Skipping plan until then."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$TF_BACKEND_HCL_B64" | base64 -d > backend.hcl
          echo "$TF_TFVARS_B64" | base64 -d > terraform.tfvars

      - name: terraform init
        if: steps.restore.outputs.skip != '1'
        run: terraform init -backend-config=backend.hcl -input=false

      - name: terraform plan
        if: steps.restore.outputs.skip != '1'
        run: terraform plan -out=tfplan -input=false

      - name: Upload plan artifact
        if: steps.restore.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/foundation/tfplan
          retention-days: 5

  apply:
    name: Apply (saved plan)
    if: github.event_name == 'workflow_dispatch'
    runs-on: sample-awsops
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    env:
      TF_BACKEND_HCL_B64: ${{ github.ref_name == 'main' && secrets.TF_BACKEND_HCL || secrets.TF_BACKEND_HCL_DEV }}
      TF_TFVARS_B64: ${{ github.ref_name == 'main' && secrets.TF_TFVARS || secrets.TF_TFVARS_DEV }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC -> ci-deployer)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.ref_name == 'main' && vars.AWS_CI_DEPLOYER_ROLE_ARN || vars.AWS_CI_DEPLOYER_DEV_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Restore backend.hcl / terraform.tfvars
        run: |
          if [ -z "$TF_BACKEND_HCL_B64" ]; then
            echo "::error::This repo's TF backend secrets are not set — see docs/runbooks/dev-repo-setup.md."
            exit 1
          fi
          echo "$TF_BACKEND_HCL_B64" | base64 -d > backend.hcl
          echo "$TF_TFVARS_B64" | base64 -d > terraform.tfvars

      - name: terraform init
        run: terraform init -backend-config=backend.hcl -input=false

      - name: Download the approved plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.plan_run_id }}" --repo "${{ github.repository }}" --name tfplan --dir .

      - name: terraform apply (exact saved plan — never re-planned)
        run: terraform apply -input=false tfplan
