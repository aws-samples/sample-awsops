name: Deploy AgentCore

# workflow_dispatch-only; the dispatched branch selects the stack —
# main -> production (environment-gated), dev -> development. Runs `make migrate` then
# `make agentcore`, in that order, per the platform's DESIGN.md
# ("make migrate -> make agentcore, order preserved"). Never reversed:
# AgentCore's Data API auth assumes migrations are already applied.

on:
  workflow_dispatch:
    inputs:
      smoke:
        description: "Invoke the deployed agent once as a smoke test (--smoke)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: migrate + agentcore
    runs-on: sample-awsops
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    env:
      TARGET: ${{ github.ref_name }}
      MAIN_ROLE: ${{ vars.AWS_CI_DEPLOYER_ROLE_ARN }}
      DEV_ROLE: ${{ vars.AWS_CI_DEPLOYER_DEV_ROLE_ARN }}
      MAIN_BACKEND_B64: ${{ secrets.TF_BACKEND_HCL }}
      MAIN_TFVARS_B64: ${{ secrets.TF_TFVARS }}
      DEV_BACKEND_B64: ${{ secrets.TF_BACKEND_HCL_DEV }}
      DEV_TFVARS_B64: ${{ secrets.TF_TFVARS_DEV }}
    steps:
      - uses: actions/checkout@v4

      - name: Select the branch's stack (fail-closed)
        id: sel
        run: |
          case "$TARGET" in
            main) ROLE="$MAIN_ROLE";;
            dev)  ROLE="$DEV_ROLE";;
            *) echo "::error::agentcore dispatches only from main or dev (got '$TARGET')"; exit 1;;
          esac
          [ -n "$ROLE" ] || { echo "::error::deployer role variable for '$TARGET' is not set"; exit 1; }
          echo "role=$ROLE" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC -> ci-deployer)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.sel.outputs.role }}
          aws-region: ap-northeast-2

      - name: Restore terraform.foundation backend
        # scripts/v2/migrate.mjs and agentcore.mjs both read terraform outputs
        # from terraform/foundation — see terraform.yml's header comment.
        working-directory: terraform/foundation
        run: |
          case "$TARGET" in
            main) B="$MAIN_BACKEND_B64"; V="$MAIN_TFVARS_B64";;
            dev)  B="$DEV_BACKEND_B64";  V="$DEV_TFVARS_B64";;
            *) echo "::error::unexpected target '$TARGET'"; exit 1;;
          esac
          if [ -z "$B" ] || [ -z "$V" ]; then
            echo "::error::TF backend secrets for '$TARGET' are not set — see docs/runbooks/dev-repo-setup.md."
            exit 1
          fi
          echo "$B" | base64 -d > backend.hcl
          echo "$V" | base64 -d > terraform.tfvars
          terraform init -backend-config=backend.hcl -input=false

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - run: npm ci --prefix scripts/v2

      - name: make migrate
        run: make migrate

      - name: make agentcore
        # SMOKE just needs to be non-empty to enable Makefile's `$(if $(SMOKE),...)`
        # — "false" is non-empty too, so only export it when actually true.
        run: make agentcore ${{ inputs.smoke && 'SMOKE=1' || '' }}
