name: Deploy AgentCore

# workflow_dispatch-only. In THIS private dev repo it targets the
# DEVELOPMENT stack (repo secrets = dev backend). Runs `make migrate` then
# `make agentcore`, in that order, per the platform's DESIGN.md
# ("make migrate -> make agentcore, order preserved"). Never reversed:
# AgentCore's Data API auth assumes migrations are already applied.

on:
  workflow_dispatch:
    inputs:
      smoke:
        description: "Invoke the deployed agent once as a smoke test (--smoke)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: migrate + agentcore
    runs-on: sample-awsops
    env:
      TF_BACKEND_HCL_B64: ${{ secrets.TF_BACKEND_HCL }}
      TF_TFVARS_B64: ${{ secrets.TF_TFVARS }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC -> ci-deployer)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_DEPLOYER_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Restore terraform.foundation backend
        # scripts/v2/migrate.mjs and agentcore.mjs both read terraform outputs
        # from terraform/foundation — see terraform.yml's header comment.
        working-directory: terraform/foundation
        run: |
          if [ -z "$TF_BACKEND_HCL_B64" ]; then
            echo "::error::This repo's TF backend secrets are not set — see docs/runbooks/dev-repo-setup.md."
            exit 1
          fi
          echo "$TF_BACKEND_HCL_B64" | base64 -d > backend.hcl
          echo "$TF_TFVARS_B64" | base64 -d > terraform.tfvars
          terraform init -backend-config=backend.hcl -input=false

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - run: npm ci --prefix scripts/v2

      - name: make migrate
        run: make migrate

      - name: make agentcore
        # SMOKE just needs to be non-empty to enable Makefile's `$(if $(SMOKE),...)`
        # — "false" is non-empty too, so only export it when actually true.
        run: make agentcore ${{ inputs.smoke && 'SMOKE=1' || '' }}
